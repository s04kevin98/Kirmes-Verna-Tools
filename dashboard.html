<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard – Burschenschaft Verna</title>
<style>
  :root{
    --ink:#1b2a22; --paper:#faf7ef; --paper-2:#ffffff; --line:#ddd3ba; --line-soft:#eae2cc;
    --forest:#2f4a3c; --forest-dark:#1f332a; --forest-tint:#e7ede8; --gold:#8a6a2f; --gold-tint:#f2ead4;
    --danger:#9c332c; --danger-tint:#f6e6e4; --success:#2f6b46; --success-tint:#e3efe6; --text-2:#5c6b60; --text-muted:#8a9188;
    --font-display:Georgia,'Times New Roman',serif; --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --font-num:'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background-color:var(--paper); background-image:repeating-linear-gradient(180deg, transparent, transparent 27px, rgba(47,74,60,0.05) 28px); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.5; padding:0 0 50px; }
  .wrap{ max-width:980px; margin:0 auto; padding:0 16px; }
  .back-strip{ background:var(--forest-dark); text-align:center; padding:8px 0; }
  .back-strip a{ color:#e7ede8; font-size:12.5px; text-decoration:none; }
  header.masthead{ background:var(--paper-2); border-bottom:3px solid var(--forest); padding:14px 0; margin-bottom:18px; position:relative; }
  header .row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding-right:120px; }
  header img{ height:40px; }
  header h1{ font-family:var(--font-display); font-size:19px; font-weight:700; margin:0; color:var(--forest-dark); }
  header .eyebrow{ font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin:0; }
  .fullscreen-btn-corner{ position:absolute; top:16px; right:16px; font-size:12px; padding:8px 12px; border-radius:6px; border:1px solid var(--line); background:var(--paper-2); color:var(--ink); }
  .status{ font-size:11px; color:var(--text-muted); }

  .section-title{ font-family:var(--font-display); font-size:15px; color:var(--forest-dark); margin:24px 0 10px; }
  .cards-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; }
  .dash-card{ background:var(--paper-2); border:1px solid var(--line); border-radius:10px; padding:16px 18px; position:relative; }
  .dash-card.accent{ background:var(--forest); border-color:var(--forest); }
  .dash-card.warn{ background:var(--gold-tint); border-color:var(--gold); }
  .dash-card.danger{ background:var(--danger-tint); border-color:var(--danger); }
  .dash-card .label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-2); margin-bottom:6px; }
  .dash-card.accent .label{ color:#cfe0d5; }
  .dash-card .value{ font-family:var(--font-num); font-size:24px; font-weight:700; color:var(--forest-dark); }
  .dash-card.accent .value{ color:#fff; }
  .dash-card .sub{ font-size:11px; color:var(--text-muted); margin-top:4px; }
  .dash-card a{ position:absolute; inset:0; }

  .empty-hint{ font-size:12.5px; color:var(--text-muted); }
  footer.note{ text-align:center; font-size:11.5px; color:var(--text-muted); margin-top:30px; }
</style>
</head>
<body>
<div class="back-strip"><a href="./kirmes-hub.html">&larr; Zurück zur Kirmes-Übersicht</a></div>

        <h1>Dashboard – Kirmes auf einen Blick</h1>
      </div>
      <span class="status" id="save-status" style="margin-left:auto;"></span>
    </div>
    <button class="fullscreen-btn-corner" id="fullscreen-btn" onclick="toggleFullscreen()">⛶ Vollbild</button>
  </header>

  <div id="inhalt"></div>

  <footer class="note">Burschenschaft Verna &middot; internes Kassenwerkzeug &middot; nicht für externe Weitergabe<br/>Aktualisiert sich automatisch alle 20 Sekunden.</footer>
</div>

<script>
const SUPABASE_URL = 'https://xifkpyaoqqghkgbgtcxd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_CEi2WjMywf7EonMniWysJg_q-LeW-TA';
const SB_HEADERS = { 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY };

function fmt(v){ return new Intl.NumberFormat('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}).format(v||0) + ' €'; }
function setStatus(t){ document.getElementById('save-status').textContent = t; }

async function get(table, query){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${query||'select=*'}`, { headers: SB_HEADERS });
    if(!res.ok) return [];
    return await res.json();
  }catch(e){ return []; }
}

async function ladeUndRender(){
  setStatus('Lade …');

  const [verkaeufe, buchungen, mitglieder, sponsoren, todos, rechnungTabs, rechnungen] = await Promise.all([
    get('verkaufe'),
    get('buchungen'),
    get('mitglieder'),
    get('sponsoren'),
    get('todos'),
    get('rechnung_tabs', 'status=eq.offen'),
    get('rechnungen')
  ]);

  // Kassen-App
  const kassenUmsatz = verkaeufe.reduce((s,v)=>s+(parseFloat(v.summe)||0),0);
  const kassenBelege = verkaeufe.filter(v=>(parseFloat(v.summe)||0)>=0).length;

  // Einnahmen & Ausgaben
  const einnahmen = buchungen.filter(b=>b.art==='einnahme').reduce((s,b)=>s+(parseFloat(b.betrag)||0),0);
  const ausgaben = buchungen.filter(b=>b.art==='ausgabe').reduce((s,b)=>s+(parseFloat(b.betrag)||0),0);
  const gewinn = einnahmen - ausgaben;

  // Strafgeldliste
  const kautionOffen = mitglieder.filter(m=>m.bezahlt && !m.rueckgezahlt);
  const kautionOffenBetrag = kautionOffen.reduce((s,m)=>{
    const strafen = (m.strafen||[]).reduce((s2,st)=>s2+(st.betrag||0),0);
    return s + Math.max(0, 150 - strafen);
  }, 0);
  const strafenGesamt = mitglieder.reduce((s,m)=> s + (m.strafen||[]).reduce((s2,st)=>s2+(st.betrag||0),0), 0);

  // Sponsoren
  const sponsoringGesamt = sponsoren.reduce((s,sp)=>s+(parseFloat(sp.betrag)||0),0);
  const sponsorenOhneRechnung = sponsoren.filter(sp=>!sp.rechnung_erstellt).length;

  // To-Do
  const todosOffen = todos.filter(t=>!t.done).length;

  // Rechnungen / Tabs
  const offeneRechnungTabsSumme = rechnungTabs.reduce((s,t)=> s + (t.positionen||[]).reduce((s2,p)=>s2+(p.menge*p.preis||0),0), 0);
  const rechnungenGesamt = rechnungen.reduce((s,r)=>s+(parseFloat(r.betrag)||0),0);

  setStatus('Aktualisiert um ' + new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}) + ' Uhr');

  document.getElementById('inhalt').innerHTML = `
    <div class="section-title">🛒 Kassen-App</div>
    <div class="cards-grid">
      <div class="dash-card accent"><a href="./kassen-app-live.html"></a><div class="label">Umsatz gesamt (netto)</div><div class="value">${fmt(kassenUmsatz)}</div></div>
      <div class="dash-card"><a href="./kassen-app-live.html"></a><div class="label">Verkaufsbelege</div><div class="value">${kassenBelege}</div></div>
    </div>

    <div class="section-title">📊 Einnahmen & Ausgaben</div>
    <div class="cards-grid">
      <div class="dash-card"><a href="./einnahmen-ausgaben.html"></a><div class="label">Einnahmen</div><div class="value" style="color:var(--success);">${fmt(einnahmen)}</div></div>
      <div class="dash-card"><a href="./einnahmen-ausgaben.html"></a><div class="label">Ausgaben</div><div class="value" style="color:var(--danger);">${fmt(ausgaben)}</div></div>
      <div class="dash-card ${gewinn>=0?'accent':'danger'}"><a href="./einnahmen-ausgaben.html"></a><div class="label">${gewinn>=0?'Überschuss':'Defizit'}</div><div class="value">${fmt(gewinn)}</div></div>
    </div>

    <div class="section-title">📋 Kautions- & Strafgeldliste</div>
    <div class="cards-grid">
      <div class="dash-card ${kautionOffen.length>0?'warn':''}"><a href="./strafgeldliste.html"></a><div class="label">Noch offene Rückzahlungen</div><div class="value">${kautionOffen.length}</div><div class="sub">${fmt(kautionOffenBetrag)}</div></div>
      <div class="dash-card"><a href="./strafgeldliste.html"></a><div class="label">Strafen gesamt</div><div class="value">${fmt(strafenGesamt)}</div></div>
    </div>

    <div class="section-title">🏷️ Sponsoren</div>
    <div class="cards-grid">
      <div class="dash-card"><a href="./sponsoren.html"></a><div class="label">Sponsoring gesamt</div><div class="value">${fmt(sponsoringGesamt)}</div></div>
      <div class="dash-card ${sponsorenOhneRechnung>0?'warn':''}"><a href="./sponsoren.html"></a><div class="label">Noch ohne Rechnung</div><div class="value">${sponsorenOhneRechnung}</div></div>
    </div>

    <div class="section-title">🧾 Rechnungen</div>
    <div class="cards-grid">
      <div class="dash-card ${offeneRechnungTabsSumme>0?'warn':''}"><a href="./rechnung.html"></a><div class="label">Offene Tabs (noch nicht abgerechnet)</div><div class="value">${fmt(offeneRechnungTabsSumme)}</div></div>
      <div class="dash-card"><a href="./rechnung.html"></a><div class="label">Rechnungen gestellt</div><div class="value">${fmt(rechnungenGesamt)}</div></div>
    </div>

    <div class="section-title">✅ To-Do</div>
    <div class="cards-grid">
      <div class="dash-card ${todosOffen>0?'warn':''}"><a href="./todo.html"></a><div class="label">Noch offen</div><div class="value">${todosOffen}</div></div>
    </div>
  `;
}

function toggleFullscreen(){
  if(!document.fullscreenElement){ document.documentElement.requestFullscreen().catch(()=>{}); }
  else{ document.exitFullscreen().catch(()=>{}); }
}
document.addEventListener('fullscreenchange', ()=>{
  const btn = document.getElementById('fullscreen-btn');
  if(btn) btn.textContent = document.fullscreenElement ? '\u26f6 Vollbild verlassen' : '\u26f6 Vollbild';
});

ladeUndRender();
setInterval(ladeUndRender, 20000);
</script>
</body>
</html>
