<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jahresvergleich – Burschenschaft Verna</title>
<style>
  :root{
    --ink:#1b2a22; --paper:#faf7ef; --paper-2:#ffffff; --line:#ddd3ba; --line-soft:#eae2cc;
    --forest:#2f4a3c; --forest-dark:#1f332a; --forest-tint:#e7ede8; --gold:#8a6a2f; --gold-tint:#f2ead4;
    --danger:#9c332c; --success:#2f6b46; --text-2:#5c6b60; --text-muted:#8a9188;
    --font-display:Georgia,'Times New Roman',serif; --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --font-num:'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background-color:var(--paper); background-image:repeating-linear-gradient(180deg, transparent, transparent 27px, rgba(47,74,60,0.05) 28px); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.5; padding:0 0 50px; }
  .wrap{ max-width:900px; margin:0 auto; padding:0 16px; }
  .back-strip{ background:var(--forest-dark); text-align:center; padding:8px 0; }
  .back-strip a{ color:#e7ede8; font-size:12.5px; text-decoration:none; }
  header.masthead{ background:var(--paper-2); border-bottom:3px solid var(--forest); padding:14px 0; margin-bottom:18px; position:relative; }
  header .row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding-right:120px; }
  header img{ height:40px; }
  header h1{ font-family:var(--font-display); font-size:19px; font-weight:700; margin:0; color:var(--forest-dark); }
  header .eyebrow{ font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin:0; }
  .fullscreen-btn-corner{ position:absolute; top:16px; right:16px; font-size:12px; padding:8px 12px; border-radius:6px; border:1px solid var(--line); background:var(--paper-2); color:var(--ink); }
  .status{ font-size:11px; color:var(--text-muted); }

  .chart-wrap{ background:var(--paper-2); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:20px; overflow-x:auto; }
  .chart-title{ font-size:13px; color:var(--text-2); margin-bottom:10px; font-weight:600; }
  .amount{ font-family:var(--font-num); font-weight:700; }

  table{ width:100%; border-collapse:collapse; background:var(--paper-2); border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:24px; }
  thead th{ text-align:left; background:var(--forest-tint); color:var(--forest-dark); padding:9px 12px; font-size:11px; text-transform:uppercase; letter-spacing:0.03em; }
  td{ padding:8px 12px; border-top:1px solid var(--line-soft); font-size:13.5px; }
  .num{ text-align:right; font-family:var(--font-num); }
  tr.aktuell td{ background:var(--gold-tint); font-weight:600; }

  .empty-hint{ text-align:center; color:var(--text-muted); font-size:13px; padding:30px; }
  footer.note{ text-align:center; font-size:11.5px; color:var(--text-muted); margin-top:30px; }
</style>
</head>

        <h1>Jahresvergleich</h1>
      </div>
      <span class="status" id="save-status" style="margin-left:auto;"></span>
    </div>
    <button class="fullscreen-btn-corner" id="fullscreen-btn" onclick="toggleFullscreen()">⛶ Vollbild</button>
  </header>

  <div id="inhalt"></div>

  <footer class="note">Burschenschaft Verna &middot; internes Kassenwerkzeug &middot; nicht für externe Weitergabe<br/>Basierend auf den im Archiv gesicherten Jahren sowie dem aktuellen, laufenden Stand.</footer>
</div>

<script>
const SUPABASE_URL = 'https://xifkpyaoqqghkgbgtcxd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_CEi2WjMywf7EonMniWysJg_q-LeW-TA';
const SB_HEADERS = { 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY };

function fmt(v){ return new Intl.NumberFormat('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}).format(v||0) + ' €'; }
function setStatus(t){ document.getElementById('save-status').textContent = t; }

function summenAusBuchungen(buchungen){
  const ein = (buchungen||[]).filter(b=>b.art==='einnahme').reduce((s,b)=>s+(parseFloat(b.betrag)||0),0);
  const aus = (buchungen||[]).filter(b=>b.art==='ausgabe').reduce((s,b)=>s+(parseFloat(b.betrag)||0),0);
  return { einnahmen:ein, ausgaben:aus, gewinn:ein-aus };
}

async function ladeDaten(){
  setStatus('Lade …');
  const jahre = [];

  // Aktueller, laufender Stand
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/buchungen?select=art,betrag`, { headers: SB_HEADERS });
    if(res.ok){
      const rows = await res.json();
      const s = summenAusBuchungen(rows);
      jahre.push({ name: 'Aktuell (laufend)', ...s, aktuell:true, datum: new Date().toISOString() });
    }
  }catch(e){}

  // Archivierte Jahre
  try{
    const res2 = await fetch(`${SUPABASE_URL}/rest/v1/kirmes_archiv?select=id,name,created_at,data`, { headers: SB_HEADERS });
    if(res2.ok){
      const rows2 = await res2.json();
      rows2.forEach(r=>{
        const s = summenAusBuchungen(r.data && r.data.buchungen);
        jahre.push({ name: r.name, ...s, aktuell:false, datum: r.created_at });
      });
    }
  }catch(e){}

  jahre.sort((a,b)=> new Date(a.datum) - new Date(b.datum));
  setStatus('Aktualisiert');
  render(jahre);
}

function balkenSvg(werte, farbeFn){
  if(werte.length===0) return '<div style="font-size:12.5px;color:var(--text-muted);">Keine Daten</div>';
  const max = Math.max(1, ...werte.map(w=>Math.abs(w.wert)));
  const barW = 90, gap = 30, chartH = 140, leftPad = 18, topPad = 24;
  let bars = '';
  werte.forEach((w,i)=>{
    const h = Math.max(2, (Math.abs(w.wert)/max)*chartH);
    const x = leftPad + i*(barW+gap);
    const y = chartH - h + topPad;
    bars += `<rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="3" fill="${farbeFn(w,i)}"/>
      <text x="${x+barW/2}" y="${y-7}" text-anchor="middle" class="amount" font-size="11">${fmt(w.wert)}</text>
      <text x="${x+barW/2}" y="${chartH+topPad+20}" text-anchor="middle" font-size="10.5">${w.label}</text>`;
  });
  const width = werte.length*(barW+gap)-gap+leftPad*2;
  return `<svg viewBox="0 0 ${width} ${chartH+topPad+30}" style="width:${width}px;max-width:100%;">${bars}</svg>`;
}

function render(jahre){
  const el = document.getElementById('inhalt');
  if(jahre.length===0){
    el.innerHTML = '<div class="empty-hint">Noch keine Daten \u2013 weder aktueller Stand noch archivierte Jahre gefunden.</div>';
    return;
  }

  const rows = jahre.map(j=>`
    <tr class="${j.aktuell?'aktuell':''}">
      <td>${j.name}${j.aktuell?' <span style="color:var(--gold);font-size:11px;">(läuft noch)</span>':''}</td>
      <td class="num">${fmt(j.einnahmen)}</td>
      <td class="num">${fmt(j.ausgaben)}</td>
      <td class="num" style="color:${j.gewinn>=0?'var(--success)':'var(--danger)'};font-weight:700;">${fmt(j.gewinn)}</td>
    </tr>`).join('');

  el.innerHTML = `
    <div class="chart-wrap">
      <div class="chart-title">Gewinn / Überschuss je Jahr</div>
      ${balkenSvg(jahre.map(j=>({label:j.name, wert:j.gewinn})), (w)=> w.wert>=0?'#2f6b46':'#9c332c')}
    </div>
    <div class="chart-wrap">
      <div class="chart-title">Einnahmen je Jahr</div>
      ${balkenSvg(jahre.map(j=>({label:j.name, wert:j.einnahmen})), ()=>'#2f6b46')}
    </div>
    <div class="chart-wrap">
      <div class="chart-title">Ausgaben je Jahr</div>
      ${balkenSvg(jahre.map(j=>({label:j.name, wert:j.ausgaben})), ()=>'#9c332c')}
    </div>
    <table>
      <thead><tr><th>Jahr / Archiv</th><th class="num">Einnahmen</th><th class="num">Ausgaben</th><th class="num">Gewinn</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function toggleFullscreen(){
  if(!document.fullscreenElement){ document.documentElement.requestFullscreen().catch(()=>{}); }
  else{ document.exitFullscreen().catch(()=>{}); }
}
document.addEventListener('fullscreenchange', ()=>{
  const btn = document.getElementById('fullscreen-btn');
  if(btn) btn.textContent = document.fullscreenElement ? '\u26f6 Vollbild verlassen' : '\u26f6 Vollbild';
});

ladeDaten();
</script>
</body>
</html>
