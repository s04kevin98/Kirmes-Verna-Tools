<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live-Statistik – Burschenschaft Verna</title>
<style>
  :root{
    --ink:#1b2a22;
    --paper:#faf7ef;
    --paper-2:#ffffff;
    --line:#ddd3ba;
    --line-soft:#eae2cc;
    --forest:#2f4a3c;
    --forest-dark:#1f332a;
    --forest-tint:#e7ede8;
    --gold:#8a6a2f;
    --danger:#9c332c;
    --success:#2f6b46;
    --text-2:#5c6b60;
    --text-muted:#8a9188;
    --font-display:Georgia,'Times New Roman',serif;
    --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --font-num:'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background:var(--paper); color:var(--ink); font-family:var(--font-body); font-size:15px; padding:0 0 40px; }
  .wrap{ max-width:640px; margin:0 auto; padding:0 16px; }

  header.masthead{ background:var(--paper-2); border-bottom:3px solid var(--forest); padding:12px 0; margin-bottom:16px; }
  header .row{ display:flex; align-items:center; gap:12px; }
  header img{ height:38px; }
  header h1{ font-family:var(--font-display); font-size:18px; margin:0; color:var(--forest-dark); }
  header .eyebrow{ font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin:0; }
  .live-dot{ width:9px; height:9px; border-radius:50%; background:var(--success); margin-left:auto; flex-shrink:0; animation:pulse 1.8s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.3;} }
  .updated{ font-size:11px; color:var(--text-muted); text-align:right; margin-bottom:14px; }

  .stat-filter{ display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .stat-filter button{ font-size:13.5px; padding:9px 16px; border-radius:18px; border:1px solid var(--line); background:var(--paper-2); }
  .stat-filter button.active{ background:var(--forest); color:#fff; border-color:var(--forest); font-weight:600; }

  .summary-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px; }
  .insight-box{ background:var(--gold-tint,#f2ead4); border:1px solid var(--gold); border-radius:10px; padding:14px 16px; margin-bottom:22px; }
  .insight-label{ font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:6px; }
  .insight-text{ font-size:14px; line-height:1.5; color:var(--ink); }
  .metric-card{ background:var(--paper-2); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .metric-card.accent{ background:var(--forest); border-color:var(--forest); grid-column:1 / -1; }
  .metric-card.accent .label{ color:#cfe0d5; }
  .metric-card.accent .value{ color:#fff; font-size:30px; }
  .metric-card .label{ font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-2); margin-bottom:6px; }
  .metric-card .value{ font-family:var(--font-num); font-size:20px; font-weight:700; }

  .chart-wrap{ margin-bottom:22px; }
  .chart-title{ font-size:13px; color:var(--text-2); margin-bottom:8px; }
  .chart-wrap svg text{ font-family:var(--font-body); fill:var(--ink); }
  .chart-wrap svg text.amount{ font-family:var(--font-num); font-weight:700; }

  table.verkaufe{ width:100%; border-collapse:collapse; background:var(--paper-2); border:1px solid var(--line); border-radius:8px; overflow:hidden; font-size:13.5px; margin-bottom:20px; }
  table.verkaufe th{ text-align:left; padding:8px 10px; background:var(--forest-tint); font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-2); }
  table.verkaufe td{ padding:7px 10px; border-top:1px solid var(--line-soft); }
  table.verkaufe td.num{ text-align:right; font-family:var(--font-num); }

  .status-msg{ text-align:center; padding:16px; color:var(--text-muted); font-size:13px; }
  .error-msg{ text-align:center; padding:14px; color:var(--danger); background:#f6e6e4; border-radius:8px; margin-bottom:16px; font-size:13px; }

  button.refresh{ width:100%; padding:12px; font-size:14px; border-radius:8px; border:1px solid var(--line); background:var(--paper-2); margin-bottom:20px; }

  footer.note{ text-align:center; font-size:11.5px; color:var(--text-muted); margin-top:26px; }
</style>
</head>
<body>

  <header class="masthead">
    <div class="row">

  </header>

  <div class="updated" id="updated-label">Lädt …</div>
  <div id="error-slot"></div>

  <div class="stat-filter" id="stat-filter"></div>
  <div id="content"></div>

  <button class="refresh" onclick="loadData()">Jetzt aktualisieren</button>

  <footer class="note">Burschenschaft Verna &middot; nur zur internen Überwachung &middot; aktualisiert automatisch alle 12 Sekunden</footer>
</div>

<script>
const SUPABASE_URL = 'https://xifkpyaoqqghkgbgtcxd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_CEi2WjMywf7EonMniWysJg_q-LeW-TA';
const TAGE = ['Freitag','Samstag','Sonntag','Montag'];

let statFilter = 'alle';
let alleVerkaeufe = [];

function fmt(v){
  return new Intl.NumberFormat('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}).format(v||0) + ' \u20ac';
}

async function loadData(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/verkaufe?select=*&order=created_at.asc`, {
      headers:{ 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY }
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const rows = await res.json();
    alleVerkaeufe = rows.map(r=>({
      id:r.id, tag:r.tag, zeit:r.zeit, datum:r.datum,
      items: r.items, summe: parseFloat(r.summe), gegeben: r.gegeben===null?null:parseFloat(r.gegeben)
    }));
    document.getElementById('error-slot').innerHTML = '';
    document.getElementById('live-dot').style.background = 'var(--success)';
    updateLabel();
    render();
  }catch(e){
    document.getElementById('error-slot').innerHTML = `<div class="error-msg">Keine Verbindung zur Kassen-App \u2013 zeige letzten bekannten Stand.</div>`;
    document.getElementById('live-dot').style.background = 'var(--danger)';
    updateLabel();
  }
}
function updateLabel(){
  const now = new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('updated-label').textContent = 'Zuletzt aktualisiert: ' + now + ' Uhr';
}

function setFilter(f){
  statFilter = f;
  render();
}
function gefiltert(){
  if(statFilter==='alle') return alleVerkaeufe;
  return alleVerkaeufe.filter(t=>t.tag===statFilter);
}

function render(){
  document.getElementById('stat-filter').innerHTML = `
    <button class="${statFilter==='alle'?'active':''}" onclick="setFilter('alle')">Alle Tage</button>
    ${TAGE.map(t=>`<button class="${statFilter===t?'active':''}" onclick="setFilter('${t}')">${t}</button>`).join('')}
  `;

  const list = gefiltert();
  const gesamt = list.reduce((s,t)=> s + t.summe, 0);

  const verkaufe = list.filter(t=> t.summe >= 0);
  const rueckgaben = list.filter(t=> t.summe < 0);
  const stkVerkauft = verkaufe.reduce((s,t)=> s + t.items.reduce((s2,i)=>s2+i.menge,0), 0);
  const stkRueckgabe = rueckgaben.reduce((s,t)=> s + t.items.reduce((s2,i)=>s2+Math.abs(i.menge),0), 0);

  const artikelMap = {};
  list.forEach(t=> t.items.forEach(it=>{
    if(!artikelMap[it.artikel]) artikelMap[it.artikel] = { menge:0, summe:0 };
    artikelMap[it.artikel].menge += it.menge;
    artikelMap[it.artikel].summe += it.preis*it.menge;
  }));

  const tagesUmsatz = {};
  TAGE.forEach(t=> tagesUmsatz[t] = alleVerkaeufe.filter(x=>x.tag===t).reduce((s,x)=> s+x.summe, 0));

  const content = document.getElementById('content');
  if(alleVerkaeufe.length===0){
    content.innerHTML = '<div class="status-msg">Noch keine Verkäufe erfasst.</div>';
    return;
  }

  content.innerHTML = `
    <div class="summary-grid">
      <div class="metric-card accent" style="grid-column:1/-1;"><div class="label">Umsatz ${statFilter==='alle'?'gesamt':statFilter} (netto)</div><div class="value">${fmt(gesamt)}</div></div>
      <div class="metric-card"><div class="label">Belege – Verkäufe</div><div class="value">${verkaufe.length}</div></div>
      <div class="metric-card"><div class="label">Belege – Rückgaben</div><div class="value">${rueckgaben.length}</div></div>
      <div class="metric-card"><div class="label">Stück verkauft</div><div class="value">${stkVerkauft}</div></div>
      <div class="metric-card"><div class="label">Stück zurückgegeben</div><div class="value">${stkRueckgabe}</div></div>
    </div>
    <div class="insight-box"><div class="insight-label">\ud83d\udcca Automatische Einschätzung</div><div class="insight-text">${einschaetzung(tagesUmsatz)}</div></div>
    <div class="chart-wrap"><div class="chart-title">Umsatz je Tag</div><div id="chart-tage"></div></div>
    <div class="chart-wrap"><div class="chart-title">Umsatz je Artikel (${statFilter==='alle'?'alle Tage':statFilter})</div><div id="chart-artikel"></div></div>
    <table class="verkaufe">
      <thead><tr><th>Artikel</th><th class="num">Menge</th><th class="num">Umsatz</th></tr></thead>
      <tbody>${Object.keys(artikelMap).map(k=>`<tr><td>${k}</td><td class="num">${artikelMap[k].menge}</td><td class="num">${fmt(artikelMap[k].summe)}</td></tr>`).join('')}</tbody>
    </table>
  `;
  renderChartTage(tagesUmsatz);
  renderChartArtikel(artikelMap);
}

function einschaetzung(tagesUmsatz){
  const tageMitDaten = TAGE.filter(t => (tagesUmsatz[t]||0) > 0);

  if(statFilter === 'alle'){
    if(tageMitDaten.length === 0) return 'Noch keine Verkäufe erfasst.';
    if(tageMitDaten.length === 1){
      return `${tageMitDaten[0]} ist bisher der einzige Tag mit Verkäufen (${fmt(tagesUmsatz[tageMitDaten[0]])}) – für einen Vergleich zwischen Tagen ist es noch zu früh.`;
    }
    const sorted = [...tageMitDaten].sort((a,b)=> tagesUmsatz[b]-tagesUmsatz[a]);
    const best = sorted[0], schwaechster = sorted[sorted.length-1];
    const avg = tageMitDaten.reduce((s,t)=>s+tagesUmsatz[t],0) / tageMitDaten.length;
    return `${best} läuft bisher am stärksten (${fmt(tagesUmsatz[best])}), ${schwaechster} am schwächsten (${fmt(tagesUmsatz[schwaechster])}). Durchschnitt über die bisherigen Tage: ${fmt(avg)}.`;
  }

  const heute = statFilter;
  const heuteUmsatz = tagesUmsatz[heute] || 0;
  const andereTage = tageMitDaten.filter(t=>t!==heute);

  if(heuteUmsatz === 0) return `Für ${heute} liegen noch keine Verkäufe vor.`;
  if(andereTage.length === 0) return `${heute} ist bisher der einzige Tag mit Daten (${fmt(heuteUmsatz)}) – noch kein Vergleichstag vorhanden.`;

  const avgAndere = andereTage.reduce((s,t)=>s+tagesUmsatz[t],0) / andereTage.length;
  const diff = heuteUmsatz - avgAndere;
  const diffPct = avgAndere > 0 ? Math.round((diff/avgAndere)*100) : 0;

  if(Math.abs(diffPct) < 10){
    return `${heute} liegt mit ${fmt(heuteUmsatz)} etwa im üblichen Rahmen der anderen Tage (Schnitt: ${fmt(avgAndere)}).`;
  }
  if(diff > 0){
    return `${heute} läuft bisher gut: ${fmt(heuteUmsatz)}, das sind rund ${diffPct}\u00a0% mehr als im Schnitt der anderen Tage (${fmt(avgAndere)}).`;
  }
  return `${heute} liegt aktuell bei ${fmt(heuteUmsatz)}, das sind rund ${Math.abs(diffPct)}\u00a0% weniger als im Schnitt der anderen Tage (${fmt(avgAndere)}). Kann sich noch ändern, falls der Tag noch nicht vorbei ist.`;
}

function renderChartTage(tagesUmsatz){
  const el = document.getElementById('chart-tage');
  if(!el) return;
  const werte = TAGE.map(t=>({ label:t, wert:tagesUmsatz[t]||0 }));
  const max = Math.max(1, ...werte.map(w=>w.wert));
  const barW = 60, gap = 22, chartH = 120, topPad = 24, leftPad = 8;
  let bars = '';
  werte.forEach((w,i)=>{
    const h = Math.max(2, (w.wert/max)*chartH);
    const x = leftPad + i*(barW+gap);
    const y = chartH - h + topPad;
    bars += `<rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="4" fill="#2f4a3c"/>
      <text x="${x+barW/2}" y="${y-6}" text-anchor="middle" class="amount" font-size="10.5">${fmt(w.wert)}</text>
      <text x="${x+barW/2}" y="${chartH+topPad+18}" text-anchor="middle" font-size="11">${w.label}</text>`;
  });
  const width = werte.length*(barW+gap)-gap+leftPad*2;
  const totalH = chartH+topPad+28;
  el.innerHTML = `<svg viewBox="0 0 ${width} ${totalH}" style="width:${width}px;height:${totalH}px;max-width:100%;display:block;">${bars}</svg>`;
}
function renderChartArtikel(artikelMap){
  const el = document.getElementById('chart-artikel');
  if(!el) return;
  const keys = Object.keys(artikelMap);
  if(keys.length===0){ el.innerHTML = '<div style="font-size:12.5px;color:var(--text-muted);">Keine Daten</div>'; return; }
  const colors = ['#2f4a3c','#8a6a2f','#5c6b60','#9c332c'];
  const werte = keys.map((k,i)=>({ label:k, wert:artikelMap[k].summe, color:colors[i%colors.length] }));
  const max = Math.max(1, ...werte.map(w=>w.wert));
  const barW = 74, gap = 26, chartH = 120, topPad = 24, leftPad = 8;
  let bars = '';
  werte.forEach((w,i)=>{
    const h = Math.max(2, (w.wert/max)*chartH);
    const x = leftPad + i*(barW+gap);
    const y = chartH - h + topPad;
    bars += `<rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="4" fill="${w.color}"/>
      <text x="${x+barW/2}" y="${y-6}" text-anchor="middle" class="amount" font-size="10.5">${fmt(w.wert)}</text>
      <text x="${x+barW/2}" y="${chartH+topPad+18}" text-anchor="middle" font-size="11">${w.label}</text>`;
  });
  const width = werte.length*(barW+gap)-gap+leftPad*2;
  const totalH = chartH+topPad+28;
  el.innerHTML = `<svg viewBox="0 0 ${width} ${totalH}" style="width:${width}px;height:${totalH}px;max-width:100%;display:block;">${bars}</svg>`;
}
