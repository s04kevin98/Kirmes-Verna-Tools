<style>
  :root{
    --ink:#1b2a22;

    --paper-2:#ffffff;
    --line:#ddd3ba;
    --forest:#2f4a3c;
    --forest-dark:#1f332a;
    --gold:#8a6a2f;
    --text-muted:#8a9188;
    --font-display:Georgia,'Times New Roman',serif;
    --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background-color:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    padding:0 0 50px;
  }
  .wrap{ max-width:900px; margin:0 auto; padding:0 16px; }

  header.masthead{ background:var(--paper-2); border-bottom:3px solid var(--forest); padding:14px 0; margin-bottom:18px; position:relative; }
  header .row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header img{ height:40px; }
  header h1{ font-family:var(--font-display); font-size:19px; font-weight:700; margin:0; color:var(--forest-dark); }
  header .eyebrow{ font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin:0; }
  .fullscreen-btn-corner{ position:absolute; top:16px; right:16px; font-size:12px; padding:8px 12px; border-radius:6px; border:1px solid var(--line); background:var(--paper-2); color:var(--ink); }

  .back-strip{ background:var(--forest-dark); text-align:center; padding:8px 0; }
  .back-strip a{ color:#e7ede8; font-size:12.5px; text-decoration:none; }
  .back-strip a:hover{ text-decoration:underline; }

  .image-card{ background:var(--paper-2); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .image-card img{ width:100%; height:auto; display:block; border-radius:6px; }

  .toolbar{ display:flex; justify-content:center; margin:16px 0; }
  .toolbar button{ font-size:13px; padding:9px 16px; border-radius:6px; border:1px solid var(--line); background:var(--paper-2); }

  footer.note{ text-align:center; font-size:11.5px; color:var(--text-muted); margin-top:30px; }
</style>
