<title>Kassen-App – Burschenschaft Verna</title>
<style>
  :root{
    --ink:#1b2a22;
    --paper:#faf7ef;
    --paper-2:#ffffff;
    --line:#ddd3ba;
    --line-soft:#eae2cc;
    --forest:#2f4a3c;
    --forest-dark:#1f332a;
    --forest-tint:#e7ede8;
    --gold:#8a6a2f;
    --gold-tint:#f2ead4;
    --danger:#9c332c;
    --danger-tint:#f6e6e4;
    --success:#2f6b46;
    --success-tint:#e4efe7;
    --text-2:#5c6b60;
    --text-muted:#8a9188;
    --radius:10px;
    --font-display:Georgia,'Times New Roman',serif;
    --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --font-num:'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background-color:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.4;
    padding:0 0 40px;
    user-select:none;
  }
  input{ user-select:text; }
  .wrap{ max-width:1100px; margin:0 auto; padding:0 16px; }

  header.masthead{ background:var(--paper-2); border-bottom:3px solid var(--forest); padding:12px 0; margin-bottom:14px; position:sticky; top:0; z-index:20; }
  header.masthead .row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  header.masthead img{ height:38px; width:auto; flex-shrink:0; }
  header.masthead h1{ font-family:var(--font-display); font-size:19px; font-weight:700; margin:0; color:var(--forest-dark); }
  header.masthead .eyebrow{ font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin:0; }
  header.masthead .status{ font-size:11px; color:var(--text-muted); font-style:italic; white-space:nowrap; margin-right:4px; }
  header.masthead .menu-btn{ background:var(--forest); color:#fff; border:none; border-radius:8px; padding:10px 16px; font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap; }

  .day-tabs{ display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .day-tabs button{ font-size:15px; padding:11px 20px; border-radius:22px; border:1px solid var(--line); background:var(--paper-2); color:var(--forest-dark); font-weight:600; }
  .day-tabs button.active{ background:var(--forest); color:#fff; border-color:var(--forest); }

  .main-grid{ display:grid; grid-template-columns:1fr 360px; gap:18px; align-items:start; }
  @media(max-width:820px){ .main-grid{ grid-template-columns:1fr; } }

  .produkt-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:16px; margin-bottom:20px; }
  .rueckgabe-btn{ width:100%; padding:14px; font-size:14.5px; font-weight:600; border-radius:10px; border:1.5px dashed var(--danger); background:var(--danger-tint); color:var(--danger); margin-bottom:12px; }
  .trinkgeld-btn{ width:100%; padding:14px; font-size:14.5px; font-weight:600; border-radius:10px; border:1.5px dashed var(--gold); background:var(--gold-tint); color:var(--gold); margin-bottom:20px; }
  .produkt-btn{ background:var(--paper-2); border:2px solid var(--line); border-radius:16px; padding:34px 16px; text-align:center; cursor:pointer; transition:transform 0.08s, background 0.08s; }
  .produkt-btn:active{ transform:scale(0.96); background:var(--forest-tint); }
  .produkt-btn .name{ font-family:var(--font-display); font-size:24px; margin-bottom:10px; }
  .produkt-btn .preis{ font-family:var(--font-num); font-size:26px; font-weight:700; color:var(--forest-dark); }

  .cart-card{ background:var(--paper-2); border:1px solid var(--line); border-radius:12px; padding:18px; position:sticky; top:70px; }
  .cart-card h2{ font-family:var(--font-display); font-size:18px; margin:0 0 12px; color:var(--forest-dark); }
  .cart-empty{ color:var(--text-muted); font-size:14px; text-align:center; padding:24px 0; }
  .cart-line{ display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--line-soft); }
  .cart-line .cl-name{ flex:1; font-size:15px; }
  .cart-line .cl-preis{ font-size:12.5px; color:var(--text-muted); }
  .cart-line .cl-qty{ display:flex; align-items:center; gap:6px; }
  .cart-line .cl-qty button{ width:30px; height:30px; border-radius:6px; border:1px solid var(--line); background:var(--paper); font-size:17px; line-height:1; }
  .cart-line .cl-menge{ font-family:var(--font-num); min-width:22px; text-align:center; }
  .cart-line .cl-sum{ font-family:var(--font-num); font-weight:600; min-width:66px; text-align:right; }
  .cart-line .cl-del{ color:var(--danger); background:none; border:none; font-size:17px; cursor:pointer; padding:2px 4px; }

  .cart-total{ display:flex; justify-content:space-between; align-items:baseline; padding:16px 0 12px; font-family:var(--font-num); }
  .cart-total .lbl{ font-family:var(--font-body); font-size:13.5px; color:var(--text-2); }
  .cart-total .val{ font-size:28px; font-weight:700; color:var(--forest-dark); }

  .gegeben-row{ display:flex; gap:8px; align-items:center; margin-bottom:10px; }
  .gegeben-display{ flex:1; font-family:var(--font-num); font-size:18px; padding:10px; border:1px solid var(--line); border-radius:8px; text-align:right; background:var(--paper-2); color:var(--text-muted); }
  .gegeben-display.filled{ color:var(--ink); font-weight:700; }
  .rueckgeld-box{ text-align:right; margin-bottom:14px; padding:10px 12px; border-radius:8px; background:var(--forest-tint); }
  .rueckgeld-box .rg-lbl{ font-size:13px; color:var(--text-2); }
  .rueckgeld-box .rg-val{ font-family:var(--font-num); font-size:30px; font-weight:800; color:var(--success); }
  .rueckgeld-box.warn{ background:var(--danger-tint); }
  .rueckgeld-box.warn .rg-val{ color:var(--danger); font-size:20px; }

  @keyframes beleg-pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.75; } }
  #offener-beleg-banner{ background:var(--danger); color:#fff; padding:11px 16px; text-align:center; font-size:14px; font-weight:700; cursor:pointer; animation:beleg-pulse 1.8s ease-in-out infinite; margin-bottom:10px; border-radius:8px; }
  #offener-beleg-banner:active{ opacity:0.85; }
  button.checkout{ width:100%; background:var(--forest); color:#fff; border:none; border-radius:10px; padding:18px; font-size:18px; font-weight:700; cursor:pointer; }
  button.checkout:disabled{ background:var(--line); color:var(--text-muted); cursor:not-allowed; }
  button.checkout:active:not(:disabled){ background:var(--forest-dark); }
  button.checkout-keep{ width:100%; background:var(--gold); color:#fff; border:none; border-radius:10px; padding:12px; font-size:13.5px; font-weight:600; cursor:pointer; margin-top:8px; }
  button.rechnung-btn{ width:100%; background:var(--paper); color:var(--forest); border:1.5px solid var(--forest); border-radius:10px; padding:11px; font-size:13.5px; font-weight:600; cursor:pointer; margin-top:8px; }
  button.rechnung-btn:disabled{ opacity:0.4; cursor:not-allowed; }
  button.paypal-btn{ width:100%; background:#003087; color:#fff; border:none; border-radius:10px; padding:11px; font-size:13.5px; font-weight:600; cursor:pointer; margin-top:8px; }
  button.paypal-btn:disabled{ opacity:0.4; cursor:not-allowed; }
  button.checkout-keep:active{ opacity:0.85; }
  button.clear-cart{ width:100%; margin-top:8px; padding:10px; font-size:13.5px; background:none; border:1px solid var(--line); border-radius:8px; color:var(--text-2); }

  .modal-overlay{ position:fixed; inset:0; background:rgba(27,42,34,0.5); display:flex; align-items:center; justify-content:center; z-index:9999; padding:20px; }
  .modal-box{ background:var(--paper-2); border-radius:16px; max-width:380px; width:100%; max-height:90vh; overflow-y:auto; padding:24px; box-shadow:0 12px 32px rgba(0,0,0,0.35); text-align:center; }
  .modal-box .m-name{ font-family:var(--font-display); font-size:24px; margin-bottom:4px; }
  .modal-box .m-preis{ font-family:var(--font-num); color:var(--text-2); font-size:15px; margin-bottom:16px; }
  .m-qty-label{ display:block; font-size:12.5px; color:var(--text-2); margin-bottom:6px; }
  .m-qty-display{ width:100%; font-family:var(--font-num); font-size:30px; font-weight:700; text-align:center; padding:10px; border:2px solid var(--forest); border-radius:10px; margin-bottom:12px; background:var(--forest-tint); color:var(--forest-dark); }
  .keypad{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px; }
  .keypad button{ padding:16px 0; font-size:20px; font-weight:600; border-radius:10px; border:1px solid var(--line); background:var(--paper); }
  .keypad button:active{ background:var(--forest-tint); }
  .keypad .keypad-clear{ color:var(--danger); }
  .keypad .keypad-back{ font-size:18px; }
  .modal-quick{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:14px; }
  .modal-quick button{ padding:9px 1px; border-radius:7px; border:1px solid var(--line); background:var(--paper); font-size:12.5px; font-weight:600; }
  .modal-actions{ display:flex; gap:10px; }
  .modal-actions button{ flex:1; padding:14px; border-radius:10px; font-size:16px; font-weight:700; border:none; }
  .modal-actions .m-cancel{ background:var(--paper); color:var(--text-2); border:1px solid var(--line); }
  .modal-actions .m-add{ background:var(--forest); color:#fff; }

  .menu-overlay{ position:fixed; inset:0; background:rgba(27,42,34,0.5); z-index:9998; display:flex; justify-content:flex-end; }
  .menu-panel{ background:var(--paper-2); width:min(420px,92vw); height:100%; padding:20px; overflow-y:auto; box-shadow:-8px 0 24px rgba(0,0,0,0.25); }
  .menu-panel h2{ font-family:var(--font-display); font-size:20px; color:var(--forest-dark); margin:0 0 16px; display:flex; justify-content:space-between; align-items:center; }
  .menu-panel .close-x{ background:none; border:none; font-size:22px; cursor:pointer; color:var(--text-2); }

  .stat-filter{ display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .stat-filter button{ font-size:13px; padding:7px 14px; border-radius:16px; border:1px solid var(--line); background:var(--paper); }
  .stat-filter button.active{ background:var(--forest); color:#fff; border-color:var(--forest); }

  .summary-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; }
  .metric-card{ background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  .metric-card.accent{ background:var(--forest); border-color:var(--forest); grid-column:1 / -1; }
  .metric-card.accent .label{ color:#cfe0d5; }
  .metric-card.accent .value{ color:#fff; }
  .metric-card .label{ font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-2); margin-bottom:5px; }
  .metric-card .value{ font-family:var(--font-num); font-size:19px; font-weight:700; }

  .chart-wrap{ margin-bottom:20px; }
  .chart-title{ font-size:12.5px; color:var(--text-2); margin-bottom:8px; }
  .chart-wrap svg text{ font-family:var(--font-body); fill:var(--ink); }
  .chart-wrap svg text.amount{ font-family:var(--font-num); font-weight:700; }

  .log-list{ max-height:220px; overflow-y:auto; background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:12px; }
  .log-entry{ display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--line-soft); gap:6px; }
  .log-entry:last-child{ border-bottom:none; }
  .log-entry .le-del{ color:var(--danger); background:none; border:none; cursor:pointer; font-size:13px; flex-shrink:0; }

  .menu-toolbar{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .menu-toolbar button{ font-size:12.5px; padding:8px 12px; border-radius:6px; border:1px solid var(--line); background:var(--paper); }
  .menu-toolbar button.danger{ color:var(--danger); border-color:var(--danger-tint); }

  footer.note{ text-align:center; font-size:11.5px; color:var(--text-muted); margin-top:30px; }
</style>

  /**

  var qrcode = function(typeNumber, errorCorrectionLevel) {

        var b2 = read();

      var bytes = [];

        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

function gegebenDigit(d){
  if(d===',' && gegebenStr.includes(',')) return;
  if(d===',' && gegebenStr==='') gegebenStr='0';
  const commaIdx = gegebenStr.indexOf(',');
  if(commaIdx>=0 && gegebenStr.length - commaIdx > 2) return; // max 2 Nachkommastellen
  if(gegebenStr.replace(',','').length >= 5) return;
  gegebenStr += d;
  document.getElementById('gegeben-modal-display').textContent = (gegebenStr || '0') + ' \u20ac';
}
function gegebenBack(){
  gegebenStr = gegebenStr.slice(0, -1);
  document.getElementById('gegeben-modal-display').textContent = (gegebenStr || '0') + ' \u20ac';
}
function gegebenLeeren(){
  gegebenStr = '';
  gegeben = null;
  updateGegebenDisplay();
  updateRueckgeld();
  closeGegebenModal();
}
function confirmGegeben(){
  const num = parseFloat(gegebenStr.replace(',','.'));
  gegeben = isNaN(num) ? null : num;
  updateGegebenDisplay();
  updateRueckgeld();
  closeGegebenModal();
}
function updateGegebenDisplay(){
  const el = document.getElementById('gegeben-display');
  if(!el) return;
  if(gegeben===null || gegeben===undefined || isNaN(gegeben)){
    el.textContent = 'optional';
    el.classList.remove('filled');
  } else {
    el.textContent = fmt(gegeben);
    el.classList.add('filled');
  }
}
function updateRueckgeld(){
  const box = document.getElementById('rueckgeld-box');
  const val = document.getElementById('rueckgeld-val');
  const keepBtn = document.getElementById('checkout-keep-btn');
  const summe = cartSumme();
  if(gegeben===null || isNaN(gegeben)){
    box.className = 'rueckgeld-box';
    val.textContent = '\u2013';
    if(keepBtn) keepBtn.style.display = 'none';
    return;
  }
  const rueck = gegeben - summe;
  if(rueck < 0){
    box.className = 'rueckgeld-box warn';
    val.textContent = 'fehlt ' + fmt(Math.abs(rueck));
    if(keepBtn) keepBtn.style.display = 'none';
  } else {
    box.className = 'rueckgeld-box';
    val.textContent = fmt(rueck);
    if(keepBtn){
      if(rueck > 0 && cart.length > 0){
        keepBtn.style.display = 'block';
        keepBtn.disabled = false;
        keepBtn.textContent = `Verkauf abschließen, ${fmt(rueck)} Rückgeld behalten`;
      } else {
        keepBtn.style.display = 'none';
      }
    }
  }
}
function checkoutKeepChange(){
  if(cart.length===0 || gegeben===null || isNaN(gegeben)) return;
  const summeVorher = cartSumme();
  const rueck = gegeben - summeVorher;
  if(rueck > 0){
    const existing = cart.find(c=>c.id==='trinkgeld');
    if(existing) existing.preis += rueck;
    else cart.push({ id:'trinkgeld', name:'Trinkgeld', preis:rueck, menge:1, istTrinkgeld:true });
  }
  checkout();
}

async function rechnungBuchen(tabId, kundeName){

    tabId = 'tab_' + Date.now().toString(36) + '_' + Math.floor(Math.random()*1000);
  }
  const neuePositionen = cart.map(c=>({ bez:c.name, menge:c.menge, preis:c.preis }));
  try{
    let bestehende = [];
    if(kundeName){
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rechnung_tabs?id=eq.${tabId}&select=positionen`, {
        headers:{ 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY }
      });
      const rows = res.ok ? await res.json() : [];
      bestehende = rows[0]?.positionen || [];
    }
    await fetch(`${SUPABASE_URL}/rest/v1/rechnung_tabs`, {
      method:'POST',
      headers:{ 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY, 'Content-Type':'application/json', 'Prefer':'return=minimal,resolution=merge-duplicates' },
      body: JSON.stringify({ id:tabId, kunde, adresse:'', positionen: bestehende.concat(neuePositionen), status:'offen' })
    });
    cart = [];
    updateRueckgeld();
    renderCart();
    document.getElementById('modal-root').innerHTML = '';
    showToast(`\u2713 Auf Rechnung für "${kunde}" gebucht`);
  }catch(e){
    showToast('\u2717 Konnte nicht gebucht werden \u2013 keine Verbindung?');
  }
}

function checkout(zahlart){
  zahlart = zahlart || 'bar';
  if(cart.length===0) return;
  const modalRoot = document.getElementById('modal-root');
  if(modalRoot) modalRoot.innerHTML = '';
  const summe = cartSumme();
  const t = {
    id: newId(),
    tag: currentTag,
    zeit: jetztUhrzeit(),
    datum: new Date().toISOString().slice(0,10),
    items: cart.map(c=>({ artikel:c.name, preis:c.preis, menge:c.menge })),
    summe,
    zahlart,
    gegeben: gegeben===null || isNaN(gegeben) ? null : gegeben,
    synced: false
  };
  transactions.push(t);
  cart = [];
  gegeben = null;
  updateGegebenDisplay();
  renderCart();
  renderUndoBar();
  scheduleSave();
  syncOne(t);
  showToast(`Verkauft: ${t.items.map(i=>`${i.menge}\u00d7${i.artikel}`).join(', ')} \u2013 ${fmt(t.summe)}`);
}
function showToast(msg){

  requestAnimationFrame(()=>{ el.style.opacity='1'; });

function renderMenuContent(){
  const content = document.getElementById('menu-content');
  if(!content) return;
  const list = gefiltert();
  const gesamt = list.reduce((s,t)=> s + t.summe, 0);

  const verkaufe = list.filter(t=> t.summe >= 0);
  const rueckgaben = list.filter(t=> t.summe < 0);
  const stkVerkauft = verkaufe.reduce((s,t)=> s + t.items.reduce((s2,i)=>s2+i.menge,0), 0);
  const stkRueckgabe = rueckgaben.reduce((s,t)=> s + t.items.reduce((s2,i)=>s2+Math.abs(i.menge),0), 0);

  const artikelMap = {};
  list.forEach(t=> t.items.forEach(it=>{
    if(!artikelMap[it.artikel]) artikelMap[it.artikel] = { menge:0, summe:0 };
    artikelMap[it.artikel].menge += it.menge;
    artikelMap[it.artikel].summe += it.preis*it.menge;
  }));

  const tagesUmsatz = {};
  TAGE.forEach(t=> tagesUmsatz[t] = transactions.filter(x=>x.tag===t).reduce((s,x)=> s+x.summe, 0));

  const avgBon = verkaufe.length > 0 ? verkaufe.reduce((s,t)=>s+t.summe,0) / verkaufe.length : 0;
  const trinkgeldTransaktionen = verkaufe.filter(t=> t.items.some(i=>i.artikel==='Trinkgeld'));
  const trinkgeldSumme = verkaufe.reduce((s,t)=> s + t.items.filter(i=>i.artikel==='Trinkgeld').reduce((s2,i)=>s2+i.preis*i.menge,0), 0);
  const trinkgeldQuote = verkaufe.length > 0 ? (trinkgeldTransaktionen.length/verkaufe.length*100) : 0;
  const rueckgabeQuote = stkVerkauft > 0 ? (stkRueckgabe/stkVerkauft*100) : 0;
  const zahlartMap = {};
  verkaufe.forEach(t=>{ const za=t.zahlart||'bar'; zahlartMap[za]=(zahlartMap[za]||0)+t.summe; });
  const zahlartLabel = { bar:'Bargeld', paypal:'PayPal', karte:'Karte' };

  let html = `<div class="stat-filter">
    <button class="${statFilter==='alle'?'active':''}" onclick="setStatFilter('alle')">Alle Tage</button>
    ${TAGE.map(t=>`<button class="${statFilter===t?'active':''}" onclick="setStatFilter('${t}')">${t}</button>`).join('')}
  </div>`;

  html += `<div class="summary-grid">
    <div class="metric-card accent" style="grid-column:1/-1;"><div class="label">Umsatz ${statFilter==='alle'?'gesamt':statFilter} (netto)</div><div class="value" style="font-size:26px;">${fmt(gesamt)}</div></div>
    <div class="metric-card"><div class="label">Belege – Verkäufe</div><div class="value">${verkaufe.length}</div></div>
    <div class="metric-card"><div class="label">Belege – Rückgaben</div><div class="value">${rueckgaben.length}</div></div>
    <div class="metric-card"><div class="label">Stück verkauft</div><div class="value">${stkVerkauft}</div></div>
    <div class="metric-card"><div class="label">Stück zurückgegeben</div><div class="value">${stkRueckgabe}</div></div>
  </div>`;

  html += `<div class="summary-grid">
    <div class="metric-card"><div class="label">\u00d8 Bon-Wert</div><div class="value">${fmt(avgBon)}</div></div>
    <div class="metric-card"><div class="label">Trinkgeld-Quote</div><div class="value">${trinkgeldQuote.toFixed(1)}%</div></div>
    <div class="metric-card"><div class="label">Trinkgeld gesamt</div><div class="value">${fmt(trinkgeldSumme)}</div></div>
    <div class="metric-card"><div class="label">Rückgabe-Quote</div><div class="value">${rueckgabeQuote.toFixed(1)}%</div></div>
  </div>`;

  html += `<div class="chart-wrap"><div class="chart-title">Umsatz je Tag</div><div id="chart-tage"></div></div>`;
  html += `<div class="chart-wrap"><div class="chart-title">Umsatz je Artikel (${statFilter==='alle'?'alle Tage':statFilter})</div><div id="chart-artikel"></div></div>`;
  html += `<div style="font-size:12.5px;color:var(--text-2);margin:16px 0 8px;">Zahlarten</div>
    <table style="width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:20px;background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden;">
      <thead><tr style="background:var(--forest-tint);"><th style="text-align:left;padding:6px 8px;">Zahlart</th><th style="text-align:right;padding:6px 8px;">Umsatz</th><th style="text-align:right;padding:6px 8px;">Anteil</th></tr></thead>
      <tbody>${Object.keys(zahlartMap).map(k=>`<tr><td style="padding:5px 8px;border-top:1px solid var(--line-soft);">${zahlartLabel[k]||k}</td><td style="text-align:right;padding:5px 8px;border-top:1px solid var(--line-soft);font-family:var(--font-num);">${fmt(zahlartMap[k])}</td><td style="text-align:right;padding:5px 8px;border-top:1px solid var(--line-soft);font-family:var(--font-num);">${(zahlartMap[k]/(gesamt||1)*100).toFixed(1)}%</td></tr>`).join('') || '<tr><td colspan="3" style="text-align:center;padding:14px;color:var(--text-muted);">Keine Daten</td></tr>'}</tbody>
    </table>`;

  html += `<div style="font-size:12.5px;color:var(--text-2);margin-bottom:8px;">Details je Artikel</div>
    <table style="width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:20px;background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden;">
      <thead><tr style="background:var(--forest-tint);"><th style="text-align:left;padding:6px 8px;">Artikel</th><th style="text-align:right;padding:6px 8px;">Menge</th><th style="text-align:right;padding:6px 8px;">Umsatz</th></tr></thead>
      <tbody>${Object.keys(artikelMap).map(k=>`<tr><td style="padding:5px 8px;border-top:1px solid var(--line-soft);">${k}</td><td style="text-align:right;padding:5px 8px;border-top:1px solid var(--line-soft);font-family:var(--font-num);">${artikelMap[k].menge}</td><td style="text-align:right;padding:5px 8px;border-top:1px solid var(--line-soft);font-family:var(--font-num);">${fmt(artikelMap[k].summe)}</td></tr>`).join('') || '<tr><td colspan="3" style="text-align:center;padding:14px;color:var(--text-muted);">Keine Verkäufe</td></tr>'}</tbody>
    </table>`;

  html += `<div style="font-size:12.5px;color:var(--text-2);margin-bottom:8px;">Verkaufsprotokoll</div>
    <div class="log-list">${[...list].reverse().map(t=>`
      <div class="log-entry">
        <span>${t.zeit} \u00b7 ${t.tag} \u2013 ${t.items.map(i=>`${i.menge}\u00d7${i.artikel}`).join(', ')}</span>
        <span style="display:flex;gap:8px;align-items:center;">
          <strong style="font-family:var(--font-num);">${fmt(t.summe)}</strong>
          <button class="le-del" onclick="removeTransaction('${t.id}')">\u2715</button>
        </span>
      </div>`).join('') || '<div style="text-align:center;color:var(--text-muted);padding:12px;">Noch keine Verkäufe erfasst.</div>'}</div>`;

  content.innerHTML = html;
  renderChartTage(tagesUmsatz);
  renderChartArtikel(artikelMap);
}

function renderChartTage(tagesUmsatz){
  const el = document.getElementById('chart-tage');
  if(!el) return;
  const werte = TAGE.map(t=>({ label:t, wert:tagesUmsatz[t]||0 }));
  const max = Math.max(1, ...werte.map(w=>w.wert));
  const barW = 60, gap = 22, chartH = 120, topPad = 24, leftPad = 8;
  let bars = '';
  werte.forEach((w,i)=>{
    const h = Math.max(2, (w.wert/max)*chartH);
    const x = leftPad + i*(barW+gap);
    const y = chartH - h + topPad;
    bars += `<rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="4" fill="#2f4a3c"/>
      <text x="${x+barW/2}" y="${y-6}" text-anchor="middle" class="amount" font-size="10.5">${fmt(w.wert)}</text>
      <text x="${x+barW/2}" y="${chartH+topPad+18}" text-anchor="middle" font-size="11">${w.label}</text>`;
  });
  const width = werte.length*(barW+gap)-gap+leftPad*2;
  const totalH = chartH+topPad+28;
  el.innerHTML = `<svg viewBox="0 0 ${width} ${totalH}" style="width:${width}px;height:${totalH}px;max-width:100%;display:block;">${bars}</svg>`;
}
function renderChartArtikel(artikelMap){
  const el = document.getElementById('chart-artikel');
  if(!el) return;
  const keys = Object.keys(artikelMap);
  if(keys.length===0){ el.innerHTML = '<div style="font-size:12.5px;color:var(--text-muted);">Keine Daten</div>'; return; }
  const colors = ['#2f4a3c','#8a6a2f','#5c6b60','#9c332c'];
  const werte = keys.map((k,i)=>({ label:k, wert:artikelMap[k].summe, color:colors[i%colors.length] }));
  const max = Math.max(1, ...werte.map(w=>w.wert));
  const barW = 74, gap = 26, chartH = 120, topPad = 24, leftPad = 8;
  let bars = '';
  werte.forEach((w,i)=>{
    const h = Math.max(2, (w.wert/max)*chartH);
    const x = leftPad + i*(barW+gap);
    const y = chartH - h + topPad;
    bars += `<rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="4" fill="${w.color}"/>
      <text x="${x+barW/2}" y="${y-6}" text-anchor="middle" class="amount" font-size="10.5">${fmt(w.wert)}</text>
      <text x="${x+barW/2}" y="${chartH+topPad+18}" text-anchor="middle" font-size="11">${w.label}</text>`;
  });
  const width = werte.length*(barW+gap)-gap+leftPad*2;
  const totalH = chartH+topPad+28;
  el.innerHTML = `<svg viewBox="0 0 ${width} ${totalH}" style="width:${width}px;height:${totalH}px;max-width:100%;display:block;">${bars}</svg>`;
}

function resetAll(){
  askConfirm('Wirklich alle Verkäufe unwiderruflich löschen? Vorher lieber "Datei speichern" nutzen.', ()=>{
    transactions = [];
    cart = [];
    gegeben = null;
    renderCart();
    renderMenuContent();
    renderUndoBar();
    scheduleSave();
    syncDeleteAll();
  });
}
async function syncDeleteAll(){
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/verkaufe?id=neq.__none__`, {
      method:'DELETE',
      headers:{ 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY }
    });
  }catch(e){}
}
function exportFile(){
  const blob = new Blob([JSON.stringify({ transactions, currentTag }, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `kassen-app-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  setStatus('Als Datei gespeichert');
}
function importFile(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      transactions = Array.isArray(parsed.transactions) ? parsed.transactions : [];
      renderCart();
      renderMenuContent();
      scheduleSave();
      setStatus('Datei geladen');
    }catch(err){ setStatus('Datei ungültig'); }
  };
  reader.readAsText(file);
  input.value = '';
}
