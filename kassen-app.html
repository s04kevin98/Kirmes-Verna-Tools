<title>Kassen-App – Burschenschaft Verna</title>
<style>
  :root{
    --ink:#1b2a22;
    --paper:#faf7ef;
    --paper-2:#ffffff;
    --line:#ddd3ba;
    --line-soft:#eae2cc;
    --forest:#2f4a3c;
    --forest-dark:#1f332a;
    --forest-tint:#e7ede8;
    --gold:#8a6a2f;
    --gold-tint:#f2ead4;
    --danger:#9c332c;
    --danger-tint:#f6e6e4;
    --success:#2f6b46;
    --success-tint:#e4efe7;
    --text-2:#5c6b60;
    --text-muted:#8a9188;
    --radius:10px;
    --font-display:Georgia,'Times New Roman',serif;
    --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --font-num:'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background-color:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.4;
    padding:0 0 40px;
    user-select:none;
  }
  input{ user-select:text; }
  .wrap{ max-width:1100px; margin:0 auto; padding:0 16px; }

  header.masthead{ background:var(--paper-2); border-bottom:3px solid var(--forest); padding:12px 0; margin-bottom:14px; position:sticky; top:0; z-index:20; }
  header.masthead .row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  header.masthead img{ height:38px; width:auto; flex-shrink:0; }
  header.masthead h1{ font-family:var(--font-display); font-size:19px; font-weight:700; margin:0; color:var(--forest-dark); }
  header.masthead .eyebrow{ font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin:0; }
  header.masthead .status{ font-size:11px; color:var(--text-muted); font-style:italic; white-space:nowrap; margin-right:4px; }
  header.masthead .menu-btn{ background:var(--forest); color:#fff; border:none; border-radius:8px; padding:10px 16px; font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap; }

  .day-tabs{ display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .day-tabs button{ font-size:15px; padding:11px 20px; border-radius:22px; border:1px solid var(--line); background:var(--paper-2); color:var(--forest-dark); font-weight:600; }
  .day-tabs button.active{ background:var(--forest); color:#fff; border-color:var(--forest); }

  .main-grid{ display:grid; grid-template-columns:1fr 360px; gap:18px; align-items:start; }
  @media(max-width:820px){ .main-grid{ grid-template-columns:1fr; } }

  .produkt-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:16px; margin-bottom:20px; }
  .produkt-btn{ background:var(--paper-2); border:2px solid var(--line); border-radius:16px; padding:34px 16px; text-align:center; cursor:pointer; transition:transform 0.08s, background 0.08s; }
  .produkt-btn:active{ transform:scale(0.96); background:var(--forest-tint); }
  .produkt-btn .name{ font-family:var(--font-display); font-size:24px; margin-bottom:10px; }
  .produkt-btn .preis{ font-family:var(--font-num); font-size:26px; font-weight:700; color:var(--forest-dark); }

  .cart-card{ background:var(--paper-2); border:1px solid var(--line); border-radius:12px; padding:18px; position:sticky; top:70px; }
  .cart-card h2{ font-family:var(--font-display); font-size:18px; margin:0 0 12px; color:var(--forest-dark); }
  .cart-empty{ color:var(--text-muted); font-size:14px; text-align:center; padding:24px 0; }
  .cart-line{ display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--line-soft); }
  .cart-line .cl-name{ flex:1; font-size:15px; }
  .cart-line .cl-preis{ font-size:12.5px; color:var(--text-muted); }
  .cart-line .cl-qty{ display:flex; align-items:center; gap:6px; }
  .cart-line .cl-qty button{ width:30px; height:30px; border-radius:6px; border:1px solid var(--line); background:var(--paper); font-size:17px; line-height:1; }
  .cart-line .cl-menge{ font-family:var(--font-num); min-width:22px; text-align:center; }
  .cart-line .cl-sum{ font-family:var(--font-num); font-weight:600; min-width:66px; text-align:right; }
  .cart-line .cl-del{ color:var(--danger); background:none; border:none; font-size:17px; cursor:pointer; padding:2px 4px; }

  .cart-total{ display:flex; justify-content:space-between; align-items:baseline; padding:16px 0 12px; font-family:var(--font-num); }
  .cart-total .lbl{ font-family:var(--font-body); font-size:13.5px; color:var(--text-2); }
  .cart-total .val{ font-size:28px; font-weight:700; color:var(--forest-dark); }

  .gegeben-row{ display:flex; gap:8px; align-items:center; margin-bottom:10px; }
  .gegeben-row input{ flex:1; font-family:var(--font-num); font-size:18px; padding:10px; border:1px solid var(--line); border-radius:8px; text-align:right; }
  .rueckgeld-box{ text-align:right; margin-bottom:14px; padding:10px 12px; border-radius:8px; background:var(--forest-tint); }
  .rueckgeld-box .rg-lbl{ font-size:13px; color:var(--text-2); }
  .rueckgeld-box .rg-val{ font-family:var(--font-num); font-size:30px; font-weight:800; color:var(--success); }
  .rueckgeld-box.warn{ background:var(--danger-tint); }
  .rueckgeld-box.warn .rg-val{ color:var(--danger); font-size:20px; }

  button.checkout{ width:100%; background:var(--forest); color:#fff; border:none; border-radius:10px; padding:18px; font-size:18px; font-weight:700; cursor:pointer; }
  button.checkout:disabled{ background:var(--line); color:var(--text-muted); cursor:not-allowed; }
  button.checkout:active:not(:disabled){ background:var(--forest-dark); }
  button.clear-cart{ width:100%; margin-top:8px; padding:10px; font-size:13.5px; background:none; border:1px solid var(--line); border-radius:8px; color:var(--text-2); }

  .modal-overlay{ position:fixed; inset:0; background:rgba(27,42,34,0.5); display:flex; align-items:center; justify-content:center; z-index:9999; padding:20px; }
  .modal-box{ background:var(--paper-2); border-radius:16px; max-width:380px; width:100%; max-height:90vh; overflow-y:auto; padding:24px; box-shadow:0 12px 32px rgba(0,0,0,0.35); text-align:center; }
  .modal-box .m-name{ font-family:var(--font-display); font-size:24px; margin-bottom:4px; }
  .modal-box .m-preis{ font-family:var(--font-num); color:var(--text-2); font-size:15px; margin-bottom:16px; }
  .m-qty-label{ display:block; font-size:12.5px; color:var(--text-2); margin-bottom:6px; }
  .modal-box input{ width:100%; font-family:var(--font-num); font-size:28px; text-align:center; padding:10px; border:2px solid var(--line); border-radius:10px; margin-bottom:14px; }
  .modal-quick{ display:flex; gap:8px; justify-content:center; margin-bottom:14px; flex-wrap:wrap; }
  .modal-quick button{ padding:10px 16px; border-radius:8px; border:1px solid var(--line); background:var(--paper); font-size:15px; font-weight:600; }
  .modal-actions{ display:flex; gap:10px; }
  .modal-actions button{ flex:1; padding:14px; border-radius:10px; font-size:16px; font-weight:700; border:none; }
  .modal-actions .m-cancel{ background:var(--paper); color:var(--text-2); border:1px solid var(--line); }
  .modal-actions .m-add{ background:var(--forest); color:#fff; }

  .menu-overlay{ position:fixed; inset:0; background:rgba(27,42,34,0.5); z-index:9998; display:flex; justify-content:flex-end; }
  .menu-panel{ background:var(--paper-2); width:min(420px,92vw); height:100%; padding:20px; overflow-y:auto; box-shadow:-8px 0 24px rgba(0,0,0,0.25); }
  .menu-panel h2{ font-family:var(--font-display); font-size:20px; color:var(--forest-dark); margin:0 0 16px; display:flex; justify-content:space-between; align-items:center; }
  .menu-panel .close-x{ background:none; border:none; font-size:22px; cursor:pointer; color:var(--text-2); }

  .stat-filter{ display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .stat-filter button{ font-size:13px; padding:7px 14px; border-radius:16px; border:1px solid var(--line); background:var(--paper); }
  .stat-filter button.active{ background:var(--forest); color:#fff; border-color:var(--forest); }

  .summary-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; }
  .metric-card{ background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  .metric-card.accent{ background:var(--forest); border-color:var(--forest); grid-column:1 / -1; }
  .metric-card.accent .label{ color:#cfe0d5; }
  .metric-card.accent .value{ color:#fff; }
  .metric-card .label{ font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-2); margin-bottom:5px; }
  .metric-card .value{ font-family:var(--font-num); font-size:19px; font-weight:700; }

  .chart-wrap{ margin-bottom:20px; }
  .chart-title{ font-size:12.5px; color:var(--text-2); margin-bottom:8px; }
  .chart-wrap svg text{ font-family:var(--font-body); fill:var(--ink); }
  .chart-wrap svg text.amount{ font-family:var(--font-num); font-weight:700; }

  .log-list{ max-height:220px; overflow-y:auto; background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:12px; }
  .log-entry{ display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--line-soft); gap:6px; }
  .log-entry:last-child{ border-bottom:none; }
  .log-entry .le-del{ color:var(--danger); background:none; border:none; cursor:pointer; font-size:13px; flex-shrink:0; }

  .menu-toolbar{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .menu-toolbar button{ font-size:12.5px; padding:8px 12px; border-radius:6px; border:1px solid var(--line); background:var(--paper); }
  .menu-toolbar button.danger{ color:var(--danger); border-color:var(--danger-tint); }

  footer.note{ text-align:center; font-size:11.5px; color:var(--text-muted); margin-top:30px; }
</style>
</head>
<body>
<div class="wrap">

<script>
const STORAGE_KEY = 'verna-kassen-app';
const TAGE = ['Freitag','Samstag','Sonntag','Montag'];
const SUPABASE_URL = 'https://xifkpyaoqqghkgbgtcxd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_CEi2WjMywf7EonMniWysJg_q-LeW-TA';

async function syncOne(t){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/verkaufe`, {
      method:'POST',
      headers:{ 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY, 'Content-Type':'application/json', 'Prefer':'return=minimal,resolution=merge-duplicates' },
      body: JSON.stringify({ id:t.id, tag:t.tag, zeit:t.zeit, datum:t.datum, items:t.items, summe:t.summe, gegeben:t.gegeben })
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    t.synced = true;
    scheduleSave();
  }catch(e){ /* offline - bleibt in der Warteschlange, wird spaeter automatisch nachgeholt */ }
  updateSyncBadge();
}
async function syncUnsent(){
  const offen = transactions.filter(t=> t.synced===false);
  for(const t of offen){ await syncOne(t); }
  updateSyncBadge();
}
function updateSyncBadge(){
  const offen = transactions.filter(t=> t.synced===false).length;
  const el = document.getElementById('sync-badge');
  if(!el) return;
  if(offen===0){ el.textContent = ''; return; }
  el.textContent = `${offen} Verkauf${offen===1?'':'e'} ${offen===1?'wartet':'warten'} auf Internetverbindung zum Synchronisieren`;
}
window.addEventListener('online', syncUnsent);
setInterval(syncUnsent, 20000);
async function syncInsert(t){ await syncOne(t); }
async function syncDelete(id){
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/verkaufe?id=eq.${encodeURIComponent(id)}`, {
      method:'DELETE',
      headers:{ 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY }
    });
  }catch(e){}
}

function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(()=>{});
  } else {
    document.exitFullscreen().catch(()=>{});
  }
}
document.addEventListener('fullscreenchange', ()=>{
  const btn = document.getElementById('fullscreen-btn');
  if(btn) btn.textContent = document.fullscreenElement ? '\u26f6 Vollbild verlassen' : '\u26f6 Vollbild';
});
let wakeLock = null;
async function requestWakeLock(){
  try{
    if('wakeLock' in navigator){
      wakeLock = await navigator.wakeLock.request('screen');
    }
  }catch(e){ /* nicht unterstuetzt oder verweigert - kein Problem, App funktioniert trotzdem */ }
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible') requestWakeLock();
});

const ARTIKEL = [
  { id:'bon', name:'Bon', preis:1.80, tage:['Freitag','Samstag','Sonntag','Montag'], quick:[1,5,10,20,50,100] },
  { id:'mbon', name:'Mitglieder-Bon', preis:1.00, tage:['Freitag'], quick:[1,5,10,20,50,100] },
  { id:'fass', name:'Fass', preis:180.00, tage:['Freitag','Samstag','Sonntag','Montag'], quick:[] }
];

let currentTag = 'Freitag';
let cart = [];
let gegeben = null;
let transactions = [];
let idCounter = 1;
let saveTimer = null;
let pendingSave = false;
let modalArtikel = null;
let menuOpen = false;
let statFilter = 'Freitag';

function fmt(v){
  return new Intl.NumberFormat('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}).format(v||0) + ' \u20ac';
}
function jetztUhrzeit(){ return new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}); }
function newId(){ return 't' + (idCounter++) + '_' + Date.now().toString(36); }

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      transactions = Array.isArray(parsed.transactions) ? parsed.transactions : [];
      transactions.forEach(t=>{ if(typeof t.synced !== 'boolean') t.synced = true; });
      currentTag = TAGE.includes(parsed.currentTag) ? parsed.currentTag : 'Freitag';
      const maxNum = transactions.reduce((m,t)=>{
        const match = /^t(\d+)_/.exec(t.id||'');
        return match ? Math.max(m, parseInt(match[1])) : m;
      }, 0);
      idCounter = maxNum + 1;
      setStatus('Zwischenstand geladen');
      return;
    }
  }catch(e){}
  setStatus('Neue Kassen-App');
}
function scheduleSave(){
  setStatus('Wird gespeichert …');
  pendingSave = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 300);
}
function flushSave(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ transactions, currentTag }));
    setStatus('Gespeichert');
    pendingSave = false;
  }catch(e){ setStatus('Speichern fehlgeschlagen'); }
}
function setStatus(t){ const el = document.getElementById('save-status'); if(el) el.textContent = t; }
window.addEventListener('beforeunload', ()=>{ if(pendingSave) flushSave(); });
window.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden' && pendingSave) flushSave(); });

function askConfirm(message, onYes){
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(27,42,34,0.45);display:flex;align-items:center;justify-content:center;z-index:10001;';
  overlay.innerHTML = `
    <div style="background:var(--paper-2);border-radius:10px;max-width:380px;width:90%;padding:20px 22px;box-shadow:0 10px 30px rgba(0,0,0,0.3);">
      <div style="font-size:14px;color:var(--ink);margin-bottom:16px;line-height:1.5;">${message}</div>
      <div style="display:flex;justify-content:flex-end;gap:8px;">
        <button id="confirm-cancel">Abbrechen</button>
        <button id="confirm-ok" style="background:var(--forest);color:#fff;border:none;">Ja, fortfahren</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#confirm-cancel').onclick = ()=> overlay.remove();
  overlay.querySelector('#confirm-ok').onclick = ()=>{ overlay.remove(); onYes(); };
}

function setTag(tag){
  currentTag = tag;
  statFilter = tag;
  renderDayTabs();
  renderProdukte();
  scheduleSave();
}
function renderDayTabs(){
  document.getElementById('day-tabs').innerHTML = TAGE.map(t=>
    `<button class="${t===currentTag?'active':''}" onclick="setTag('${t}')">${t}</button>`
  ).join('');
}

function renderProdukte(){
  const grid = document.getElementById('produkt-grid');
  const liste = ARTIKEL.filter(a=> a.tage.includes(currentTag));
  grid.innerHTML = liste.map(a=>`
    <div class="produkt-btn" onclick="openModal('${a.id}')">
      <div class="name">${a.name}</div>
      <div class="preis">${fmt(a.preis)}</div>
    </div>
  `).join('');
}

function openModal(artikelId){
  modalArtikel = ARTIKEL.find(a=>a.id===artikelId);
  renderModal();
}
function closeModal(){
  modalArtikel = null;
  document.getElementById('modal-root').innerHTML = '';
}
function renderModal(){
  const root = document.getElementById('modal-root');
  if(!modalArtikel){ root.innerHTML=''; return; }
  const a = modalArtikel;
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal();">
      <div class="modal-box">
        <div class="m-name">${a.name}</div>
        <div class="m-preis">${fmt(a.preis)} pro Stück</div>
        ${a.quick && a.quick.length ? `<div class="modal-quick">
          ${a.quick.map(n=>`<button onclick="setModalQty(${n})">${n}</button>`).join('')}
        </div>` : ''}
        <label class="m-qty-label" for="modal-qty">${a.quick && a.quick.length ? 'oder eigene Menge:' : 'Menge:'}</label>
        <input type="number" id="modal-qty" min="1" value="1" inputmode="numeric"/>
        <div class="modal-actions">
          <button class="m-cancel" onclick="closeModal()">Abbrechen</button>
          <button class="m-add" onclick="confirmModal()">In Beleg legen</button>
        </div>
      </div>
    </div>`;
}
function setModalQty(n){
  document.getElementById('modal-qty').value = n;
}
function confirmModal(){
  const input = document.getElementById('modal-qty');
  let menge = parseInt(input.value) || 1;
  if(menge < 1) menge = 1;
  addToCart(modalArtikel.id, modalArtikel.name, modalArtikel.preis, menge);
  closeModal();
}

function addToCart(id, name, preis, menge){
  const existing = cart.find(c=>c.id===id);
  if(existing) existing.menge += menge;
  else cart.push({ id, name, preis, menge });
  renderCart();
}
function changeQty(idx, delta){
  cart[idx].menge += delta;
  if(cart[idx].menge <= 0) cart.splice(idx,1);
  renderCart();
}
function removeLine(idx){
  cart.splice(idx,1);
  renderCart();
}
function clearCart(){
  cart = [];
  gegeben = null;
  document.getElementById('gegeben-input').value = '';
  renderCart();
}
function cartSumme(){ return cart.reduce((s,c)=> s + c.preis*c.menge, 0); }

function renderCart(){
  const linesEl = document.getElementById('cart-lines');
  if(cart.length===0){
    linesEl.innerHTML = '<div class="cart-empty">Noch nichts im Beleg.<br/>Artikel links antippen.</div>';
  } else {
    linesEl.innerHTML = cart.map((c,i)=>`
      <div class="cart-line">
        <div>
          <div class="cl-name">${c.name}</div>
          <div class="cl-preis">${fmt(c.preis)} / Stk.</div>
        </div>
        <div class="cl-qty">
          <button onclick="changeQty(${i},-1)">\u2212</button>
          <span class="cl-menge">${c.menge}</span>
          <button onclick="changeQty(${i},1)">+</button>
        </div>
        <div class="cl-sum">${fmt(c.preis*c.menge)}</div>
        <button class="cl-del" onclick="removeLine(${i})" title="Entfernen">\u2715</button>
      </div>
    `).join('');
  }
  const summe = cartSumme();
  document.getElementById('cart-total').textContent = fmt(summe);
  document.getElementById('checkout-btn').disabled = cart.length===0;
  updateRueckgeld();
}
function onGegeben(val){
  gegeben = val === '' ? null : parseFloat(val);
  updateRueckgeld();
}
function updateRueckgeld(){
  const box = document.getElementById('rueckgeld-box');
  const val = document.getElementById('rueckgeld-val');
  const summe = cartSumme();
  if(gegeben===null || isNaN(gegeben)){
    box.className = 'rueckgeld-box';
    val.textContent = '\u2013';
    return;
  }
  const rueck = gegeben - summe;
  if(rueck < 0){
    box.className = 'rueckgeld-box warn';
    val.textContent = 'fehlt ' + fmt(Math.abs(rueck));
  } else {
    box.className = 'rueckgeld-box';
    val.textContent = fmt(rueck);
  }
}

function checkout(){
  if(cart.length===0) return;
  const summe = cartSumme();
  const t = {
    id: newId(),
    tag: currentTag,
    zeit: jetztUhrzeit(),
    datum: new Date().toISOString().slice(0,10),
    items: cart.map(c=>({ artikel:c.name, preis:c.preis, menge:c.menge })),
    summe,
    gegeben: gegeben===null || isNaN(gegeben) ? null : gegeben,
    synced: false
  };
  transactions.push(t);
  cart = [];
  gegeben = null;
  document.getElementById('gegeben-input').value = '';
  renderCart();
  renderUndoBar();
  scheduleSave();
  syncOne(t);
  showToast(`Verkauft: ${t.items.map(i=>`${i.menge}\u00d7${i.artikel}`).join(', ')} \u2013 ${fmt(t.summe)}`);
}
function showToast(msg){
  const el = document.createElement('div');
  el.textContent = '\u2713 ' + msg;
  el.style.cssText = 'position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--forest);color:#fff;padding:14px 22px;border-radius:10px;font-size:15px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,0.3);z-index:10002;opacity:0;transition:opacity 0.2s;';
  document.body.appendChild(el);
  requestAnimationFrame(()=>{ el.style.opacity='1'; });
  setTimeout(()=>{ el.style.opacity='0'; setTimeout(()=>el.remove(), 250); }, 1800);
}
function undoLastSale(){
  if(transactions.length===0) return;
  const last = transactions.pop();
  renderUndoBar();
  scheduleSave();
  syncDelete(last.id);
  showToast(`Rückgängig: ${last.items.map(i=>`${i.menge}\u00d7${i.artikel}`).join(', ')} \u2013 ${fmt(last.summe)}`);
}
function renderUndoBar(){
  const el = document.getElementById('undo-bar');
  if(!el) return;
  const last = transactions[transactions.length-1];
  if(!last){ el.innerHTML=''; return; }
  el.innerHTML = `<button style="width:100%;padding:14px;font-size:15px;font-weight:600;border-radius:10px;border:1px solid var(--danger-tint);background:var(--danger-tint);color:var(--danger);" onclick="undoLastSale()">
    \u21b6 Letzten Verkauf rückgängig (${last.items.map(i=>`${i.menge}\u00d7${i.artikel}`).join(', ')} \u2013 ${fmt(last.summe)})
  </button>`;
}
function removeTransaction(id){
  transactions = transactions.filter(t=>t.id!==id);
  renderMenuContent();
  renderUndoBar();
  scheduleSave();
  syncDelete(id);
}

function openMenu(){
  menuOpen = true;
  statFilter = currentTag;
  renderMenu();
}
function closeMenu(){
  menuOpen = false;
  document.getElementById('menu-root').innerHTML = '';
}
function renderMenu(){
  const root = document.getElementById('menu-root');
  if(!menuOpen){ root.innerHTML=''; return; }
  root.innerHTML = `
    <div class="menu-overlay" onclick="if(event.target===this) closeMenu();">
      <div class="menu-panel">
        <h2>Statistik <button class="close-x" onclick="closeMenu()">\u2715</button></h2>
        <div class="menu-toolbar">
          <button onclick="printTagesabschluss()">Tagesabschluss drucken</button>
          <button onclick="exportFile()">Datei speichern</button>
          <button onclick="document.getElementById('import-input').click()">Datei laden</button>
          <input type="file" id="import-input" accept="application/json" style="display:none;" onchange="importFile(this)"/>
          <button class="danger" onclick="resetAll()">Alle Verkäufe löschen</button>
        </div>
        <div id="menu-content"></div>
      </div>
    </div>`;
  renderMenuContent();
}
function setStatFilter(f){
  statFilter = f;
  renderMenuContent();
}
function gefiltert(){
  if(statFilter==='alle') return transactions;
  return transactions.filter(t=>t.tag===statFilter);
}

function renderMenuContent(){
  const content = document.getElementById('menu-content');
  if(!content) return;
  const list = gefiltert();
  const gesamt = list.reduce((s,t)=> s + t.summe, 0);

  const artikelMap = {};
  list.forEach(t=> t.items.forEach(it=>{
    if(!artikelMap[it.artikel]) artikelMap[it.artikel] = { menge:0, summe:0 };
    artikelMap[it.artikel].menge += it.menge;
    artikelMap[it.artikel].summe += it.preis*it.menge;
  }));

  const tagesUmsatz = {};
  TAGE.forEach(t=> tagesUmsatz[t] = transactions.filter(x=>x.tag===t).reduce((s,x)=> s+x.summe, 0));

  let html = `<div class="stat-filter">
    <button class="${statFilter==='alle'?'active':''}" onclick="setStatFilter('alle')">Alle Tage</button>
    ${TAGE.map(t=>`<button class="${statFilter===t?'active':''}" onclick="setStatFilter('${t}')">${t}</button>`).join('')}
  </div>`;

  html += `<div class="summary-grid">
    <div class="metric-card accent"><div class="label">Umsatz ${statFilter==='alle'?'gesamt':statFilter}</div><div class="value" style="font-size:26px;">${fmt(gesamt)}</div></div>
    <div class="metric-card"><div class="label">Anzahl Belege</div><div class="value">${list.length}</div></div>
    <div class="metric-card"><div class="label">Stück gesamt</div><div class="value">${Object.values(artikelMap).reduce((s,a)=>s+a.menge,0)}</div></div>
  </div>`;

  html += `<div class="chart-wrap"><div class="chart-title">Umsatz je Tag</div><div id="chart-tage"></div></div>`;
  html += `<div class="chart-wrap"><div class="chart-title">Umsatz je Artikel (${statFilter==='alle'?'alle Tage':statFilter})</div><div id="chart-artikel"></div></div>`;

  html += `<div style="font-size:12.5px;color:var(--text-2);margin-bottom:8px;">Details je Artikel</div>
    <table style="width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:20px;background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden;">
      <thead><tr style="background:var(--forest-tint);"><th style="text-align:left;padding:6px 8px;">Artikel</th><th style="text-align:right;padding:6px 8px;">Menge</th><th style="text-align:right;padding:6px 8px;">Umsatz</th></tr></thead>
      <tbody>${Object.keys(artikelMap).map(k=>`<tr><td style="padding:5px 8px;border-top:1px solid var(--line-soft);">${k}</td><td style="text-align:right;padding:5px 8px;border-top:1px solid var(--line-soft);font-family:var(--font-num);">${artikelMap[k].menge}</td><td style="text-align:right;padding:5px 8px;border-top:1px solid var(--line-soft);font-family:var(--font-num);">${fmt(artikelMap[k].summe)}</td></tr>`).join('') || '<tr><td colspan="3" style="text-align:center;padding:14px;color:var(--text-muted);">Keine Verkäufe</td></tr>'}</tbody>
    </table>`;

  html += `<div style="font-size:12.5px;color:var(--text-2);margin-bottom:8px;">Verkaufsprotokoll</div>
    <div class="log-list">${[...list].reverse().map(t=>`
      <div class="log-entry">
        <span>${t.zeit} \u00b7 ${t.tag} \u2013 ${t.items.map(i=>`${i.menge}\u00d7${i.artikel}`).join(', ')}</span>
        <span style="display:flex;gap:8px;align-items:center;">
          <strong style="font-family:var(--font-num);">${fmt(t.summe)}</strong>
          <button class="le-del" onclick="removeTransaction('${t.id}')">\u2715</button>
        </span>
      </div>`).join('') || '<div style="text-align:center;color:var(--text-muted);padding:12px;">Noch keine Verkäufe erfasst.</div>'}</div>`;

  content.innerHTML = html;
  renderChartTage(tagesUmsatz);
  renderChartArtikel(artikelMap);
}

function renderChartTage(tagesUmsatz){
  const el = document.getElementById('chart-tage');
  if(!el) return;
  const werte = TAGE.map(t=>({ label:t, wert:tagesUmsatz[t]||0 }));
  const max = Math.max(1, ...werte.map(w=>w.wert));
  const barW = 60, gap = 22, chartH = 120, topPad = 24, leftPad = 8;
  let bars = '';
  werte.forEach((w,i)=>{
    const h = Math.max(2, (w.wert/max)*chartH);
    const x = leftPad + i*(barW+gap);
    const y = chartH - h + topPad;
    bars += `<rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="4" fill="#2f4a3c"/>
      <text x="${x+barW/2}" y="${y-6}" text-anchor="middle" class="amount" font-size="10.5">${fmt(w.wert)}</text>
      <text x="${x+barW/2}" y="${chartH+topPad+18}" text-anchor="middle" font-size="11">${w.label}</text>`;
  });
  const width = werte.length*(barW+gap)-gap+leftPad*2;
  const totalH = chartH+topPad+28;
  el.innerHTML = `<svg viewBox="0 0 ${width} ${totalH}" style="width:${width}px;height:${totalH}px;max-width:100%;display:block;">${bars}</svg>`;
}
function renderChartArtikel(artikelMap){
  const el = document.getElementById('chart-artikel');
  if(!el) return;
  const keys = Object.keys(artikelMap);
  if(keys.length===0){ el.innerHTML = '<div style="font-size:12.5px;color:var(--text-muted);">Keine Daten</div>'; return; }
  const colors = ['#2f4a3c','#8a6a2f','#5c6b60','#9c332c'];
  const werte = keys.map((k,i)=>({ label:k, wert:artikelMap[k].summe, color:colors[i%colors.length] }));
  const max = Math.max(1, ...werte.map(w=>w.wert));
  const barW = 74, gap = 26, chartH = 120, topPad = 24, leftPad = 8;
  let bars = '';
  werte.forEach((w,i)=>{
    const h = Math.max(2, (w.wert/max)*chartH);
    const x = leftPad + i*(barW+gap);
    const y = chartH - h + topPad;
    bars += `<rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="4" fill="${w.color}"/>
      <text x="${x+barW/2}" y="${y-6}" text-anchor="middle" class="amount" font-size="10.5">${fmt(w.wert)}</text>
      <text x="${x+barW/2}" y="${chartH+topPad+18}" text-anchor="middle" font-size="11">${w.label}</text>`;
  });
  const width = werte.length*(barW+gap)-gap+leftPad*2;
  const totalH = chartH+topPad+28;
  el.innerHTML = `<svg viewBox="0 0 ${width} ${totalH}" style="width:${width}px;height:${totalH}px;max-width:100%;display:block;">${bars}</svg>`;
}

function resetAll(){
  askConfirm('Wirklich alle Verkäufe unwiderruflich löschen? Vorher lieber "Datei speichern" nutzen.', ()=>{
    transactions = [];
    cart = [];
    gegeben = null;
    renderCart();
    renderMenuContent();
    renderUndoBar();
    scheduleSave();
    syncDeleteAll();
  });
}
async function syncDeleteAll(){
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/verkaufe?id=neq.__none__`, {
      method:'DELETE',
      headers:{ 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY }
    });
  }catch(e){}
}
function exportFile(){
  const blob = new Blob([JSON.stringify({ transactions, currentTag }, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `kassen-app-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  setStatus('Als Datei gespeichert');
}
function importFile(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      transactions = Array.isArray(parsed.transactions) ? parsed.transactions : [];
      renderCart();
      renderMenuContent();
      scheduleSave();
      setStatus('Datei geladen');
    }catch(err){ setStatus('Datei ungültig'); }
  };
  reader.readAsText(file);
  input.value = '';
}

function printTagesabschluss(){
  const list = gefiltert();
  const gesamt = list.reduce((s,t)=> s + t.summe, 0);
  const artikelMap = {};
  list.forEach(t=> t.items.forEach(it=>{
    if(!artikelMap[it.artikel]) artikelMap[it.artikel] = { menge:0, summe:0 };
    artikelMap[it.artikel].menge += it.menge;
    artikelMap[it.artikel].summe += it.preis*it.menge;
  }));
  const rows = Object.keys(artikelMap).map(k=>`<tr><td>${k}</td><td class="num">${artikelMap[k].menge}</td><td class="num">${fmt(artikelMap[k].summe)}</td></tr>`).join('');
  const heute = new Date().toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
  const logoSrc = document.getElementById('logo-img').src;
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Tagesabschluss</title>
    <style>
      @page{ size:A4; margin:14mm; }
      body{ font-family:Arial,sans-serif; color:#1a1a1a; font-size:11px; }
      .header{ display:flex; align-items:center; gap:12px; border-bottom:2px solid #1a1a1a; padding-bottom:8px; margin-bottom:16px; }
      .header img{ height:44px; }
      .header h1{ font-size:17px; margin:0 0 2px; }
      .header .org{ font-size:10px; color:#333; font-weight:600; }
      .header .meta{ margin-left:auto; text-align:right; font-size:9.5px; color:#555; }
      table{ width:100%; border-collapse:collapse; font-size:10px; }
      thead th{ background:#eee; border-bottom:1px solid #999; padding:5px 7px; text-align:left; }
      .num{ text-align:right; }
      tbody td{ padding:4px 7px; border-bottom:0.5px solid #ddd; }
      .total-box{ margin-top:16px; padding:10px 14px; background:#f7f7f7; border:1px solid #999; font-weight:700; display:flex; justify-content:space-between; font-size:14px; }
    </style></head><body>
    <div class="header">
      <img src="${logoSrc}"/>
      <div><div class="org">Burschenschaft Verna</div><h1>Tagesabschluss Kassen-App \u2013 ${statFilter==='alle'?'Alle Tage':statFilter}</h1></div>
      <div class="meta">Erstellt am ${heute}</div>
    </div>
    <table><thead><tr><th>Artikel</th><th class="num">Menge</th><th class="num">Umsatz</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="3">Keine Verkäufe</td></tr>'}</tbody></table>
    <div class="total-box"><span>Gesamtumsatz</span><span>${fmt(gesamt)}</span></div>
    </body></html>`;
  const win = window.open('', '_blank');
  if(win){ win.document.write(html); win.document.close(); setTimeout(()=>win.print(), 300); }
