<title>Einnahmen &amp; Ausgaben – Kirmes Verna</title>
<style>
  :root{
    --ink:#1b2a22;
    --paper:#faf7ef;
    --paper-2:#ffffff;
    --line:#ddd3ba;
    --line-soft:#eae2cc;
    --forest:#2f4a3c;
    --forest-dark:#1f332a;
    --forest-tint:#e7ede8;
    --gold:#8a6a2f;
    --gold-tint:#f2ead4;
    --danger:#9c332c;
    --danger-tint:#f6e6e4;
    --success:#2f6b46;
    --success-tint:#e4efe7;
    --text-2:#5c6b60;
    --text-muted:#8a9188;
    --radius:6px;
    --font-display:Georgia,'Times New Roman',serif;
    --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --font-num:'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background-color:var(--paper);
    background-image:repeating-linear-gradient(180deg, transparent, transparent 27px, rgba(47,74,60,0.05) 28px);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.5;
    padding:0 0 60px;
  }
  .wrap{ max-width:1080px; margin:0 auto; padding:0 20px; }

  header.masthead{ background:var(--paper-2); border-bottom:3px solid var(--forest); padding:22px 0 18px; margin-bottom:22px; }
  header.masthead .row{ display:flex; align-items:center; gap:18px; }
  header.masthead img{ height:58px; width:auto; flex-shrink:0; }
  header.masthead .titles{ flex:1; min-width:0; }
  header.masthead .eyebrow{ font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--gold); font-weight:600; margin:0 0 3px; }
  header.masthead h1{ font-family:var(--font-display); font-size:23px; font-weight:700; margin:0; color:var(--forest-dark); }
  .kirmes-name-input{ border:none; border-bottom:1px dashed var(--line); background:transparent; font-family:var(--font-display); font-size:14px; color:var(--text-2); padding:3px 0; margin-top:5px; width:280px; max-width:100%; }
  .kirmes-name-input:focus{ outline:none; border-bottom-color:var(--forest); }
  header.masthead .meta{ text-align:right; font-size:12.5px; color:var(--text-2); white-space:nowrap; }

  .toolbar{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; margin-bottom:22px; }
  .toolbar .actions{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }

  button{ font-family:var(--font-body); font-size:13px; background:var(--paper-2); color:var(--forest-dark); border:1px solid var(--line); border-radius:var(--radius); padding:8px 14px; cursor:pointer; }
  button:hover{ background:var(--forest-tint); border-color:var(--forest); }
  button.primary{ background:var(--forest); color:#fff; border-color:var(--forest); }
  button.primary:hover{ background:var(--forest-dark); }
  button.danger-btn{ color:var(--danger); border-color:var(--danger-tint); }
  button.danger-btn:hover{ background:var(--danger-tint); border-color:var(--danger); }
  button.small{ padding:5px 10px; font-size:12px; }
  .status{ font-size:11.5px; color:var(--text-muted); font-style:italic; }

  input[type=text], input[type=number], input[type=date], select{ font-family:var(--font-body); font-size:13.5px; border:1px solid var(--line); border-radius:var(--radius); padding:6px 8px; background:var(--paper-2); color:var(--ink); }
  input[type=number]{ font-family:var(--font-num); text-align:right; }
  input:focus, select:focus{ outline:none; border-color:var(--forest); box-shadow:0 0 0 2px var(--forest-tint); }

  .gesamt-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:28px; }
  .metric-card{ background:var(--paper-2); border:1px solid var(--line); border-radius:8px; padding:14px 16px; }
  .metric-card.accent{ background:var(--forest); border-color:var(--forest); }
  .metric-card.accent .label{ color:#cfe0d5; }
  .metric-card.accent .value{ color:#fff; }
  .metric-card.danger-card{ background:var(--danger-tint); border-color:var(--danger); }
  .metric-card.danger-card .label{ color:var(--danger); }
  .metric-card.danger-card .value{ color:var(--danger); }
  .metric-card .label{ font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-2); margin-bottom:6px; }
  .metric-card .value{ font-family:var(--font-num); font-size:21px; font-weight:700; }

  .section-block{ margin-bottom:30px; }
  .section-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; padding-bottom:8px; border-bottom:2px solid var(--forest); }
  .section-head h2{ font-family:var(--font-display); font-size:19px; margin:0; color:var(--forest-dark); }
  .section-head .sum{ font-family:var(--font-num); font-size:17px; font-weight:700; }
  .section-head .sum.income{ color:var(--success); }
  .section-head .sum.expense{ color:var(--danger); }

  table.ledger{ width:100%; border-collapse:collapse; background:var(--paper-2); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  table.ledger th{ text-align:left; font-size:11px; letter-spacing:0.05em; text-transform:uppercase; color:var(--text-muted); font-weight:600; padding:8px 10px; background:var(--forest-tint); border-bottom:1px solid var(--line); }
  table.ledger td{ padding:6px 8px; border-bottom:1px solid var(--line-soft); vertical-align:middle; }
  table.ledger tr:last-child td{ border-bottom:none; }
  table.ledger input[type=text]{ width:100%; min-width:140px; }
  table.ledger input[type=date]{ width:130px; }
  table.ledger input[type=number]{ width:100px; }
  table.ledger select{ min-width:150px; }
  .empty-row td{ color:var(--text-muted); font-style:italic; text-align:center; padding:18px; }

  .add-btn-row{ margin-top:10px; }

  .chart-wrap{ margin-top:6px; }
  .chart-wrap svg text{ font-family:var(--font-body); fill:var(--ink); }
  .chart-wrap svg text.amount{ font-family:var(--font-num); font-weight:700; }

  footer.note{ text-align:center; font-size:12px; color:var(--text-muted); margin-top:30px; }

  @media(max-width:820px){
    table.ledger, table.ledger thead, table.ledger tbody, table.ledger th, table.ledger td, table.ledger tr{ display:block; }
    table.ledger thead{ display:none; }
    table.ledger tr{ border-bottom:2px solid var(--line); padding:10px 0; }
    table.ledger td{ border-bottom:none; padding:4px 10px; }
    table.ledger input, table.ledger select{ width:100%; }
  }
</style>
</head>

<div class="wrap">

<script>
const STORAGE_KEY = 'verna-einnahmen-ausgaben';
const KAT_EINNAHME = ['Eintrittsgelder','Bon-/Getränkeverkauf','Spenden','Sponsoring','Sonstige Einnahmen'];
const KAT_AUSGABE = ['Wareneinkauf (Getränke/Essen)','Band/Musik','Standgebühr/Miete','Genehmigungen/Versicherung','Werbung/Deko','Sonstige Ausgaben'];
const SUPABASE_URL = 'https://xifkpyaoqqghkgbgtcxd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_CEi2WjMywf7EonMniWysJg_q-LeW-TA';
const SB_HEADERS = { 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY, 'Content-Type':'application/json' };

let eintraege = [];
let kirmesName = '';
let saveTimer = null;
let pendingSave = false;
let idCounter = 1;
let cloudOk = false;
let syncTimers = {};

function fmt(v){
  return new Intl.NumberFormat('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}).format(v) + ' \u20ac';
}
function heuteISO(){ return new Date().toISOString().slice(0,10); }
function newId(){ return 'e' + (idCounter++) + '_' + Date.now().toString(36); }

async function loadFromCloud(silent){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/buchungen?select=*&order=datum.asc`, { headers: SB_HEADERS });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const rows = await res.json();
    eintraege = rows.map(r=>({ id:r.id, art:r.art, datum:r.datum, bezeichnung:r.bezeichnung||'', kategorie:r.kategorie||'', betrag:parseFloat(r.betrag)||0 }));
    const maxNum = eintraege.reduce((m,x)=>{
      const match = /^e(\d+)_/.exec(x.id||'');
      return match ? Math.max(m, parseInt(match[1])) : m;
    }, 0);
    idCounter = Math.max(idCounter, maxNum + 1);
    cloudOk = true;
    updateCloudBadge();
    if(!silent) setStatus('Von Cloud geladen');
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({kirmesName, eintraege})); }catch(e){}
    return true;
  }catch(e){
    cloudOk = false;
    updateCloudBadge();
    return false;
  }
}
async function syncUpsertEintrag(e){
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/buchungen`, {
      method:'POST',
      headers: Object.assign({}, SB_HEADERS, { 'Prefer':'return=minimal,resolution=merge-duplicates' }),
      body: JSON.stringify({ id:e.id, art:e.art, datum:e.datum||null, bezeichnung:e.bezeichnung, kategorie:e.kategorie, betrag:e.betrag })
    });
    cloudOk = true;
  }catch(err){ cloudOk = false; }
  updateCloudBadge();
}
async function syncDeleteEintrag(id){
  try{ await fetch(`${SUPABASE_URL}/rest/v1/buchungen?id=eq.${encodeURIComponent(id)}`, { method:'DELETE', headers: SB_HEADERS }); }catch(e){}
}
function scheduleSyncEintrag(e){
  clearTimeout(syncTimers[e.id]);
  syncTimers[e.id] = setTimeout(()=> syncUpsertEintrag(e), 600);
}
function updateCloudBadge(){
  const el = document.getElementById('cloud-badge');
  if(!el) return;
  el.textContent = cloudOk ? '\u2601 Online \u2013 auf allen Geräten sichtbar' : '\u26a0 Offline \u2013 nur lokal gespeichert';
  el.style.color = cloudOk ? 'var(--success)' : 'var(--danger)';
}
function istEditingText(){
  const el = document.activeElement;
  return el && (el.tagName==='INPUT' || el.tagName==='TEXTAREA') && el.type!=='checkbox';
}
setInterval(async ()=>{
  if(istEditingText()) return;
  const ok = await loadFromCloud(true);
  if(ok) renderAll();
}, 15000);

async function importAusKassenApp(){
  const statusEl = document.getElementById('kassenapp-import-status');
  if(statusEl) statusEl.textContent = 'lädt …';
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/verkaufe?select=tag,summe`, { headers: SB_HEADERS });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const rows = await res.json();
    const perTag = {};
    rows.forEach(r=>{ perTag[r.tag] = (perTag[r.tag]||0) + (parseFloat(r.summe)||0); });
    let count = 0;
    Object.keys(perTag).forEach(tag=>{
      const fixedId = 'kassenapp-' + tag;
      let e = eintraege.find(x=>x.id===fixedId);
      if(!e){
        e = { id: fixedId, art:'einnahme', datum: heuteISO(), bezeichnung: 'Kassen-App Verkäufe ' + tag, kategorie: 'Bon-/Getränkeverkauf', betrag: 0 };
        eintraege.push(e);
      }
      e.betrag = perTag[tag];
      syncUpsertEintrag(e);
      count++;
    });
    renderAll();
    scheduleSave();
    const uhrzeit = new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
    if(statusEl) statusEl.textContent = count + ' Tag(e) importiert/aktualisiert um ' + uhrzeit + ' Uhr';
  }catch(e){
    if(statusEl) statusEl.textContent = 'keine Verbindung zur Kassen-App';
  }
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.eintraege)){
        eintraege = parsed.eintraege;
        kirmesName = parsed.kirmesName || '';
      } else if(Array.isArray(parsed)){
        eintraege = parsed;
      }
      const maxNum = eintraege.reduce((m,x)=>{
        const match = /^e(\d+)_/.exec(x.id||'');
        return match ? Math.max(m, parseInt(match[1])) : m;
      }, 0);
      idCounter = maxNum + 1;
      setStatus('Zwischenstand geladen');
      return;
    }
  }catch(e){}
  setStatus('Neue Übersicht');
}
function scheduleSave(){
  setStatus('Wird gespeichert …');
  pendingSave = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 300);
}
function flushSave(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({kirmesName, eintraege}));
    setStatus('Gespeichert');
    pendingSave = false;
  }catch(e){ setStatus('Speichern fehlgeschlagen'); }
}
function setStatus(t){ const el = document.getElementById('save-status'); if(el) el.textContent = t; }
window.addEventListener('beforeunload', ()=>{ if(pendingSave) flushSave(); });
window.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden' && pendingSave) flushSave(); });

function onKirmesName(val){
  kirmesName = val;
  scheduleSave();
}

function askConfirm(message, onYes){
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(27,42,34,0.45);display:flex;align-items:center;justify-content:center;z-index:10001;';
  overlay.innerHTML = `
    <div style="background:var(--paper-2);border-radius:10px;max-width:420px;width:90%;padding:22px 24px;box-shadow:0 10px 30px rgba(0,0,0,0.3);">
      <div style="font-size:14.5px;color:var(--ink);margin-bottom:18px;line-height:1.5;">${message}</div>
      <div style="display:flex;justify-content:flex-end;gap:8px;">
        <button id="confirm-cancel">Abbrechen</button>
        <button id="confirm-ok" class="primary">Ja, fortfahren</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#confirm-cancel').onclick = ()=> overlay.remove();
  overlay.querySelector('#confirm-ok').onclick = ()=>{ overlay.remove(); onYes(); };
}
function resetAll(){
  askConfirm('Liste wirklich komplett leeren? Alle Einnahmen und Ausgaben werden gelöscht.', ()=>{
    eintraege = [];
    kirmesName = '';
    document.getElementById('kirmes-name').value = '';
    renderAll();
    scheduleSave();
    syncDeleteAllBuchungen();
  });
}
async function syncDeleteAllBuchungen(){
  try{ await fetch(`${SUPABASE_URL}/rest/v1/buchungen?id=neq.__none__`, { method:'DELETE', headers: SB_HEADERS }); }catch(e){}
}

function exportFile(){
  const blob = new Blob([JSON.stringify({kirmesName, eintraege}, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const datum = new Date().toISOString().slice(0,10);
  const slug = (kirmesName||'einnahmen-ausgaben').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  a.href = url;
  a.download = `${slug || 'einnahmen-ausgaben'}-${datum}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  setStatus('Als Datei gespeichert');
}
function importFile(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(parsed && Array.isArray(parsed.eintraege)){
        eintraege = parsed.eintraege;
        kirmesName = parsed.kirmesName || '';
      } else if(Array.isArray(parsed)){
        eintraege = parsed;
      }
      document.getElementById('kirmes-name').value = kirmesName;
      renderAll();
      scheduleSave();
      setStatus('Datei geladen');
    }catch(err){ setStatus('Datei ungültig'); }
  };
  reader.readAsText(file);
  input.value = '';
}

function addEintrag(art){
  const kategorien = art==='einnahme' ? KAT_EINNAHME : KAT_AUSGABE;
  const e = { id:newId(), art, datum:heuteISO(), bezeichnung:'', kategorie:kategorien[0], betrag:0 };
  eintraege.push(e);
  renderAll();
  scheduleSave();
  syncUpsertEintrag(e);
}
function removeEintrag(id){
  eintraege = eintraege.filter(e=>e.id!==id);
  renderAll();
  scheduleSave();
  syncDeleteEintrag(id);
}
function onFeld(id, feld, val){
  const e = eintraege.find(x=>x.id===id);
  if(!e) return;
  e[feld] = feld==='betrag' ? (parseFloat(val)||0) : val;
  if(feld==='betrag'){ refreshTotals(); }
  scheduleSave();
  scheduleSyncEintrag(e);
}

function rowHTML(e){
  const kategorien = e.art==='einnahme' ? KAT_EINNAHME : KAT_AUSGABE;
  return `<tr data-id="${e.id}">
    <td><input type="date" value="${e.datum||''}" onchange="onFeld('${e.id}','datum',this.value)"/></td>
    <td><input type="text" value="${e.bezeichnung||''}" placeholder="z.B. Getränke-Großhandel" oninput="onFeld('${e.id}','bezeichnung',this.value)"/></td>
    <td><select onchange="onFeld('${e.id}','kategorie',this.value)">
      ${kategorien.map(k=>`<option value="${k}" ${e.kategorie===k?'selected':''}>${k}</option>`).join('')}
    </select></td>
    <td><input type="number" min="0" step="0.5" value="${e.betrag||''}" placeholder="0,00" oninput="onFeld('${e.id}','betrag',this.value)"/></td>
    <td><button class="small danger-btn" onclick="removeEintrag('${e.id}')" title="Entfernen">\u2715</button></td>
  </tr>`;
}

function renderTables(){
  const einnahmen = eintraege.filter(e=>e.art==='einnahme');
  const ausgaben = eintraege.filter(e=>e.art==='ausgabe');
  const tblE = document.getElementById('tbl-einnahmen');
  const tblA = document.getElementById('tbl-ausgaben');
  tblE.innerHTML = einnahmen.length ? einnahmen.map(rowHTML).join('') : '<tr class="empty-row"><td colspan="5">Noch keine Einnahmen erfasst.</td></tr>';
  tblA.innerHTML = ausgaben.length ? ausgaben.map(rowHTML).join('') : '<tr class="empty-row"><td colspan="5">Noch keine Ausgaben erfasst.</td></tr>';
}

function summeEinnahmen(){ return eintraege.filter(e=>e.art==='einnahme').reduce((s,e)=> s + (e.betrag||0), 0); }
function summeAusgaben(){ return eintraege.filter(e=>e.art==='ausgabe').reduce((s,e)=> s + (e.betrag||0), 0); }

function refreshTotals(){
  const se = summeEinnahmen(), sa = summeAusgaben(), saldo = se - sa;
  document.getElementById('sum-einnahmen').textContent = fmt(se);
  document.getElementById('sum-ausgaben').textContent = fmt(sa);
  renderGesamt(se, sa, saldo);
  renderChart(se, sa, saldo);
}

function renderGesamt(se, sa, saldo){
  const el = document.getElementById('gesamt-summary');
  const saldoClass = saldo >= 0 ? 'accent' : 'danger-card';
  el.innerHTML = `
    <div class="metric-card"><div class="label">Einnahmen gesamt</div><div class="value" style="color:var(--success);">${fmt(se)}</div></div>
    <div class="metric-card"><div class="label">Ausgaben gesamt</div><div class="value" style="color:var(--danger);">${fmt(sa)}</div></div>
    <div class="metric-card ${saldoClass}"><div class="label">${saldo>=0?'Überschuss':'Defizit'}</div><div class="value">${fmt(saldo)}</div></div>
    <div class="metric-card"><div class="label">Anzahl Buchungen</div><div class="value">${eintraege.length}</div></div>
  `;
}

function renderChart(se, sa, saldo){
  const el = document.getElementById('chart');
  const max = Math.max(1, se, sa, Math.abs(saldo));
  const barW = 130, gap = 50, chartH = 150, leftPad = 20, topPad = 26;
  const bars = [
    {label:'Einnahmen', val:se, color:'#2f6b46'},
    {label:'Ausgaben', val:sa, color:'#9c332c'},
    {label: saldo>=0 ? 'Überschuss' : 'Defizit', val:Math.abs(saldo), color:'#2f4a3c'}
  ];
  let svgBars = '';
  bars.forEach((b,i)=>{
    const h = Math.max(2, (b.val/max)*chartH);
    const x = leftPad + i*(barW+gap);
    const y = chartH - h + topPad;
    svgBars += `<rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="3" fill="${b.color}"/>
      <text x="${x+barW/2}" y="${y-8}" text-anchor="middle" class="amount" font-size="13">${fmt(b.val)}</text>
      <text x="${x+barW/2}" y="${chartH+topPad+24}" text-anchor="middle" font-size="13">${b.label}</text>`;
  });
  const width = bars.length*(barW+gap)-gap+leftPad*2;
  el.innerHTML = `<svg viewBox="0 0 ${width} ${chartH+topPad+34}" style="width:100%;max-width:560px;">${svgBars}</svg>`;
}

function renderAll(){
  renderTables();
  refreshTotals();
}

    </style></head><body><div class="page">
    <div class="header">

        <h1>${kirmesName ? kirmesName : 'Kirmes'} \u2013 Einnahmen &amp; Ausgaben</h1>

      <div class="row"><span>Ausgaben gesamt</span><span>${fmt(sa)}</span></div>
      <div class="row total"><span>${saldo>=0?'Überschuss':'Defizit'}</span><span>${fmt(saldo)}</span></div>

  const win = window.open('', '_blank');
  if(win){ win.document.write(html); win.document.close(); setTimeout(()=>win.print(), 300); }
}
