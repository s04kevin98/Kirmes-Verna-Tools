<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sponsoren & Werbebanner – Burschenschaft Verna</title>
<style>
  :root{
    --ink:#1b2a22; --paper:#faf7ef; --paper-2:#ffffff; --line:#ddd3ba; --line-soft:#eae2cc;
    --forest:#2f4a3c; --forest-dark:#1f332a; --forest-tint:#e7ede8; --gold:#8a6a2f; --gold-tint:#f2ead4;
    --danger:#9c332c; --danger-tint:#f6e6e4; --success:#2f6b46; --success-tint:#e3efe6; --text-2:#5c6b60; --text-muted:#8a9188;
    --font-display:Georgia,'Times New Roman',serif; --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --font-num:'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background-color:var(--paper); background-image:repeating-linear-gradient(180deg, transparent, transparent 27px, rgba(47,74,60,0.05) 28px); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.5; padding:0 0 50px; }
  .wrap{ max-width:900px; margin:0 auto; padding:0 16px; }
  .back-strip{ background:var(--forest-dark); text-align:center; padding:8px 0; }
  .back-strip a{ color:#e7ede8; font-size:12.5px; text-decoration:none; }
  header.masthead{ background:var(--paper-2); border-bottom:3px solid var(--forest); padding:14px 0; margin-bottom:18px; position:relative; }
  header .row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding-right:120px; }
  header img{ height:40px; }
  header h1{ font-family:var(--font-display); font-size:19px; font-weight:700; margin:0; color:var(--forest-dark); }
  header .eyebrow{ font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--gold); font-weight:600; margin:0; }
  .fullscreen-btn-corner{ position:absolute; top:16px; right:16px; font-size:12px; padding:8px 12px; border-radius:6px; border:1px solid var(--line); background:var(--paper-2); color:var(--ink); }
  .status{ font-size:11px; color:var(--text-muted); }
  .cloud-badge{ font-size:11px; font-weight:600; }

  .summary-cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:20px; }
  .metric-card{ background:var(--paper-2); border:1px solid var(--line); border-radius:8px; padding:14px 16px; }
  .metric-card.accent{ background:var(--forest); border-color:var(--forest); }
  .metric-card.accent .label{ color:#cfe0d5; } .metric-card.accent .value{ color:#fff; }
  .metric-card .label{ font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-2); margin-bottom:6px; }
  .metric-card .value{ font-family:var(--font-num); font-size:20px; font-weight:700; }

  .panel{ background:var(--paper-2); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:20px; }
  .panel h2{ font-family:var(--font-display); font-size:16px; margin:0 0 12px; color:var(--forest-dark); }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
  @media(max-width:560px){ .field-row{ grid-template-columns:1fr; } }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field label{ font-size:12px; color:var(--text-2); font-weight:600; }
  .field input, .field textarea{ padding:9px 10px; border:1px solid var(--line); border-radius:6px; font-size:14px; font-family:inherit; }
  .field textarea{ resize:vertical; min-height:44px; }
  button.primary{ background:var(--forest); color:#fff; border:none; padding:12px 18px; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; }

  .sp-item{ background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px; }
  .sp-item .top{ display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:8px; margin-bottom:6px; }
  .sp-item .firma{ font-weight:700; font-size:15px; color:var(--forest-dark); }
  .sp-item .betrag{ font-family:var(--font-num); font-weight:700; font-size:15px; }
  .sp-item .meta{ font-size:12.5px; color:var(--text-2); margin-bottom:10px; }
  .sp-item .beschreibung{ font-size:13px; color:var(--ink); margin-bottom:10px; }
  .sp-item .badges{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .badge{ font-size:11px; padding:4px 9px; border-radius:12px; font-weight:600; }
  .badge.ok{ background:var(--success-tint); color:var(--success); }
  .badge.offen{ background:var(--gold-tint); color:var(--gold); }
  .sp-item .actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .sp-item .actions button{ font-size:12.5px; padding:7px 12px; border-radius:6px; border:1px solid var(--line); background:var(--paper-2); cursor:pointer; }
  .sp-item .actions button.hervorgehoben{ background:var(--forest); color:#fff; border-color:var(--forest); }
  .sp-item .actions button.danger{ color:var(--danger); border-color:var(--danger-tint); }
  .sp-item label.check{ display:flex; align-items:center; gap:6px; font-size:12.5px; cursor:pointer; }

  .empty-hint{ text-align:center; color:var(--text-muted); font-size:13px; padding:24px; }
  footer.note{ text-align:center; font-size:11.5px; color:var(--text-muted); margin-top:30px; }
</style>
</head>

<script>
const SUPABASE_URL = 'https://xifkpyaoqqghkgbgtcxd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_CEi2WjMywf7EonMniWysJg_q-LeW-TA';
const SB_HEADERS = { 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY, 'Content-Type':'application/json' };

let sponsoren = [];
let cloudOk = false;

function fmt(v){ return new Intl.NumberFormat('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}).format(v||0) + ' €'; }
function setStatus(t){ document.getElementById('save-status').textContent = t; }
function updateCloudBadge(){
  const el = document.getElementById('cloud-badge');
  if(!el) return;
  el.textContent = cloudOk ? '\u2601 Online \u2013 auf allen Geräten sichtbar' : '\u26a0 Offline \u2013 nur lokal gespeichert';
  el.style.color = cloudOk ? 'var(--success)' : 'var(--danger)';
}
function showToast(msg, isError){
  const el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = `position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:${isError?'#9c332c':'#2f4a3c'};color:#fff;padding:14px 22px;border-radius:10px;font-size:14.5px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,0.3);z-index:10002;max-width:90vw;text-align:center;opacity:0;transition:opacity 0.2s;`;
  document.body.appendChild(el);
  requestAnimationFrame(()=>{ el.style.opacity='1'; });
  setTimeout(()=>{ el.style.opacity='0'; setTimeout(()=>el.remove(), 250); }, 3200);
}
function newId(){ return 'sp_' + Date.now().toString(36) + '_' + Math.floor(Math.random()*1000); }

function loadLocal(){
  try{ const raw = localStorage.getItem('verna-sponsoren'); if(raw) sponsoren = JSON.parse(raw); }catch(e){}
}
function saveLocal(){ try{ localStorage.setItem('verna-sponsoren', JSON.stringify(sponsoren)); }catch(e){} }

async function loadFromCloud(silent){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/sponsoren?select=*&order=datum.desc`, { headers: SB_HEADERS });
    if(!res.ok) throw new Error();
    sponsoren = await res.json();
    cloudOk = true; updateCloudBadge();
    if(!silent) setStatus('Von Cloud geladen');
    saveLocal();
    return true;
  }catch(e){ cloudOk = false; updateCloudBadge(); return false; }
}
let saveTimer = null;
function scheduleSave(){
  setStatus('Wird gespeichert …');
  saveLocal();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>setStatus('Gespeichert'), 400);
}
async function syncUpsert(s){
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/sponsoren`, {
      method:'POST',
      headers: Object.assign({}, SB_HEADERS, {'Prefer':'return=minimal,resolution=merge-duplicates'}),
      body: JSON.stringify(s)
    });
    cloudOk = true;
  }catch(e){ cloudOk = false; }
  updateCloudBadge();
}
async function syncDelete(id){
  try{ await fetch(`${SUPABASE_URL}/rest/v1/sponsoren?id=eq.${id}`, { method:'DELETE', headers: SB_HEADERS }); }catch(e){}
}
function istEditingText(){
  const el = document.activeElement;
  return el && (el.tagName==='INPUT' || el.tagName==='TEXTAREA');
}
setInterval(async ()=>{
  if(istEditingText()) return;
  const ok = await loadFromCloud(true);
  if(ok) renderAll();
}, 15000);

function sponsorHinzufuegen(){
  const firma = document.getElementById('f-firma').value.trim();
  const betrag = parseFloat(document.getElementById('f-betrag').value) || 0;
  if(!firma){ showToast('\u2717 Bitte Firmenname eingeben', true); return; }
  if(betrag<=0){ showToast('\u2717 Bitte Betrag eingeben', true); return; }
  const s = {
    id: newId(),
    firma,
    ansprechpartner: document.getElementById('f-ansprechpartner').value.trim(),
    adresse: document.getElementById('f-adresse').value.trim(),
    beschreibung: document.getElementById('f-beschreibung').value.trim(),
    betrag,
    datum: document.getElementById('f-datum').value || new Date().toISOString().slice(0,10),
    rechnung_erstellt: false,
    bezahlt: false
  };
  sponsoren.unshift(s);
  ['f-firma','f-ansprechpartner','f-adresse','f-betrag','f-beschreibung'].forEach(id=>document.getElementById(id).value='');
  renderAll();
  scheduleSave();
  syncUpsert(s);
  showToast('\u2713 Sponsor eingetragen');
}
function toggleFlag(id, feld){
  const s = sponsoren.find(x=>x.id===id);
  if(!s) return;
  s[feld] = !s[feld];
  renderAll();
  scheduleSave();
  syncUpsert(s);
}
function sponsorLoeschen(id){
  if(!confirm('Diesen Sponsor-Eintrag wirklich löschen?')) return;
  sponsoren = sponsoren.filter(x=>x.id!==id);
  renderAll();
  scheduleSave();
  syncDelete(id);
}
function rechnungErstellen(id){
  const s = sponsoren.find(x=>x.id===id);
  if(!s) return;
  const params = new URLSearchParams({
    firma: s.firma,
    adresse: s.adresse||'',
    betreff: 'Werbefläche Kirmeszelt' + (s.beschreibung ? ' – ' + s.beschreibung : ''),
    pos_bez: s.beschreibung || 'Werbefläche Kirmeszelt',
    pos_betrag: s.betrag
  });
  s.rechnung_erstellt = true;
  scheduleSave();
  syncUpsert(s);
  window.location.href = 'rechnung.html?' + params.toString();
}

function renderAll(){
  const gesamt = sponsoren.reduce((sum,s)=>sum+s.betrag,0);
  const offen = sponsoren.filter(s=>!s.rechnung_erstellt).length;
  const unbezahlt = sponsoren.filter(s=>!s.bezahlt).length;
  document.getElementById('summary-cards').innerHTML = `
    <div class="metric-card accent"><div class="label">Sponsoring gesamt</div><div class="value">${fmt(gesamt)}</div></div>
    <div class="metric-card"><div class="label">Sponsoren gesamt</div><div class="value">${sponsoren.length}</div></div>
    <div class="metric-card"><div class="label">Ohne Rechnung</div><div class="value">${offen}</div></div>
    <div class="metric-card"><div class="label">Noch unbezahlt</div><div class="value">${unbezahlt}</div></div>
  `;

  const el = document.getElementById('sponsoren-liste');
  if(sponsoren.length===0){
    el.innerHTML = '<div class="empty-hint">Noch keine Sponsoren eingetragen.</div>';
    return;
  }
  el.innerHTML = sponsoren.map(s=>`
    <div class="sp-item">
      <div class="top">
        <div class="firma">${s.firma}</div>
        <div class="betrag">${fmt(s.betrag)}</div>
      </div>
      <div class="meta">${s.datum||''}${s.ansprechpartner ? ' &middot; '+s.ansprechpartner : ''}</div>
      ${s.beschreibung ? `<div class="beschreibung">${s.beschreibung}</div>` : ''}
      <div class="badges">
        <span class="badge ${s.rechnung_erstellt?'ok':'offen'}">${s.rechnung_erstellt?'\u2713 Rechnung erstellt':'\u26a0 Noch keine Rechnung'}</span>
        <span class="badge ${s.bezahlt?'ok':'offen'}">${s.bezahlt?'\u2713 Bezahlt':'\u26a0 Unbezahlt'}</span>
      </div>
      <div class="actions">
        <button class="hervorgehoben" onclick="rechnungErstellen('${s.id}')">🧾 Rechnung erstellen</button>
        <label class="check"><input type="checkbox" ${s.bezahlt?'checked':''} onchange="toggleFlag('${s.id}','bezahlt')"/> Als bezahlt markieren</label>
        <button class="danger" onclick="sponsorLoeschen('${s.id}')">Löschen</button>
      </div>
    </div>
  `).join('');
}

function toggleFullscreen(){
  if(!document.fullscreenElement){ document.documentElement.requestFullscreen().catch(()=>{}); }
  else{ document.exitFullscreen().catch(()=>{}); }
}
document.addEventListener('fullscreenchange', ()=>{
  const btn = document.getElementById('fullscreen-btn');
  if(btn) btn.textContent = document.fullscreenElement ? '\u26f6 Vollbild verlassen' : '\u26f6 Vollbild';
});

document.getElementById('f-datum').value = new Date().toISOString().slice(0,10);
loadLocal();
renderAll();
loadFromCloud(true).then(ok=>{ if(ok) renderAll(); });
</script>
</body>
</html>
