<title>Kirmes Kassenabrechnung – Burschenschaft Verna</title>
<style>
  :root{
    --ink:#1b2a22;
    --paper:#faf7ef;
    --paper-2:#ffffff;
    --line:#ddd3ba;
    --line-soft:#eae2cc;
    --forest:#2f4a3c;
    --forest-dark:#1f332a;
    --forest-tint:#e7ede8;
    --gold:#8a6a2f;
    --gold-tint:#f2ead4;
    --danger:#9c332c;
    --danger-tint:#f6e6e4;
    --success:#2f6b46;
    --success-tint:#e4efe7;
    --warning:#8a5a1f;
    --warning-tint:#f5ecda;
    --text-2:#5c6b60;
    --text-muted:#8a9188;
    --radius:6px;
    --font-display:Georgia,'Times New Roman',serif;
    --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --font-num:'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background-color:var(--paper);
    background-image:repeating-linear-gradient(180deg, transparent, transparent 27px, rgba(47,74,60,0.05) 28px);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.5;
    padding:0 0 60px;
  }
  .wrap{ max-width:920px; margin:0 auto; padding:0 20px; }

  header.masthead{
    background:var(--paper-2);
    border-bottom:3px solid var(--forest);
    padding:22px 0 18px;
    margin-bottom:22px;
  }
  header.masthead .row{ display:flex; align-items:center; gap:18px; }
  header.masthead img{ height:58px; width:auto; flex-shrink:0; }
  header.masthead .titles{ flex:1; min-width:0; }
  header.masthead .eyebrow{ font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--gold); font-weight:600; margin:0 0 3px; }
  header.masthead h1{ font-family:var(--font-display); font-size:25px; font-weight:700; margin:0; color:var(--forest-dark); }
  .kirmes-name-input{ border:none; border-bottom:1px dashed var(--line); background:transparent; font-family:var(--font-display); font-size:14px; color:var(--text-2); padding:3px 0; margin-top:5px; width:280px; max-width:100%; }
  .kirmes-name-input:focus{ outline:none; border-bottom-color:var(--forest); }
  header.masthead .meta{ text-align:right; font-size:12.5px; color:var(--text-2); white-space:nowrap; }

  .toolbar{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; margin-bottom:20px; }
  .toolbar .actions{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }

  button{
    font-family:var(--font-body);
    font-size:13px;
    background:var(--paper-2);
    color:var(--forest-dark);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:8px 14px;
    cursor:pointer;
    transition:background 0.12s, border-color 0.12s;
  }
  button:hover{ background:var(--forest-tint); border-color:var(--forest); }
  button:active{ transform:scale(0.98); }
  button.primary{ background:var(--forest); color:#fff; border-color:var(--forest); }
  button.primary:hover{ background:var(--forest-dark); }
  button.danger-btn{ color:var(--danger); border-color:var(--danger-tint); }
  button.danger-btn:hover{ background:var(--danger-tint); border-color:var(--danger); }
  button.small{ padding:5px 10px; font-size:12px; }
  .status{ font-size:11.5px; color:var(--text-muted); font-style:italic; }

  .tabs-day{ display:flex; flex-wrap:wrap; gap:4px; background:var(--forest-tint); border-radius:var(--radius); padding:3px; margin-bottom:14px; max-width:100%; }
  .tabs-day button{
    border:none; background:transparent; padding:8px 18px; border-radius:4px;
    font-family:var(--font-display); font-size:14px; color:var(--forest-dark);
  }
  .tabs-day button.active{ background:var(--forest); color:#fff; }
  .tabs-day button:hover:not(.active){ background:rgba(47,74,60,0.12); }

  .tabs-kasse{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .tabs-kasse button{ font-size:13px; padding:7px 14px; border-radius:20px; }
  .tabs-kasse button.active{ background:var(--gold-tint); border-color:var(--gold); color:var(--gold); font-weight:600; }
  .tabs-kasse .dot-warn{ display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--warning); margin-left:6px; vertical-align:middle; }

  .card{ background:var(--paper-2); border:1px solid var(--line); border-radius:8px; padding:22px 24px; margin-bottom:18px; }
  .section-label{ font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--gold); font-weight:700; margin:0 0 12px; padding-bottom:8px; border-bottom:1px solid var(--line-soft); display:flex; justify-content:space-between; align-items:baseline; }
  .section-label .hint{ font-size:11px; letter-spacing:0; text-transform:none; color:var(--text-muted); font-weight:400; }

  label.field-label{ font-size:12.5px; color:var(--text-2); display:block; margin-bottom:5px; }
  input[type=text], input[type=number]{
    font-family:var(--font-body); font-size:14px; border:1px solid var(--line); border-radius:var(--radius);
    padding:8px 10px; background:var(--paper-2); color:var(--ink);
  }
  input[type=number]{ font-family:var(--font-num); text-align:right; }
  input:focus, select:focus{ outline:none; border-color:var(--forest); box-shadow:0 0 0 2px var(--forest-tint); }
  select{ font-family:var(--font-body); font-size:13px; border:1px solid var(--line); border-radius:var(--radius); padding:7px 8px; background:var(--paper-2); color:var(--ink); }

  .verantwortlich-row{ margin-bottom:16px; }
  .versiegel-row{ display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .versiegel-row .status-text{ font-size:12.5px; color:var(--text-2); }

  .warnbanner{ background:var(--warning-tint); color:var(--warning); border:1px solid #e3d2a8; border-radius:var(--radius); padding:9px 13px; margin-bottom:16px; font-size:13px; }

  table.ledger{ width:100%; border-collapse:collapse; font-size:13.5px; }
  table.ledger th{ text-align:left; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-muted); font-weight:600; padding:6px 8px; border-bottom:1px solid var(--line); }
  table.ledger th.num, table.ledger td.num{ text-align:right; }
  table.ledger td{ padding:6px 8px; border-bottom:1px solid var(--line-soft); font-family:var(--font-num); }
  table.ledger tr:nth-child(even) td{ background:rgba(47,74,60,0.025); }
  table.ledger td.label-cell{ font-family:var(--font-body); color:var(--text-2); }
  .rolle-hint{ font-size:11px; color:var(--text-muted); font-family:var(--font-body); }
  table.ledger tr.sum-row td{ border-top:2px solid var(--forest); border-bottom:none; font-weight:700; font-family:var(--font-num); background:var(--forest-tint); }
  table.ledger tr.sum-row td.label-cell{ font-family:var(--font-body); color:var(--ink); }
  table.ledger input[type=number]{ width:66px; padding:5px 7px; font-size:13px; }

  .bewegung-row{ display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
  .bewegung-row input[type=text]{ flex:1; min-width:180px; }
  .bewegung-row input[type=number]{ width:90px; }

  .verkauf-fields{ display:flex; gap:20px; flex-wrap:wrap; }
  .verkauf-fields .field{ min-width:120px; }
  .verkauf-fields .static-value{ font-family:var(--font-num); font-size:15px; padding:8px 0; }

  .result-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; background:var(--forest-tint); border-radius:var(--radius); padding:16px; margin-top:8px; }
  .result-grid .item .label{ font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-2); margin-bottom:4px; }
  .result-grid .item .value{ font-family:var(--font-num); font-size:21px; font-weight:700; }
  .value.ok{ color:var(--success); }
  .value.warn{ color:var(--danger); }

  .gesamt-title{ font-family:var(--font-display); font-size:16px; color:var(--forest-dark); margin:32px 0 12px; padding-top:20px; border-top:2px solid var(--forest); }
  .gesamt-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:28px; }
  .metric-card{ background:var(--paper-2); border:1px solid var(--line); border-radius:8px; padding:14px 16px; }
  .metric-card.accent{ background:var(--forest); border-color:var(--forest); }
  .metric-card.accent .label{ color:#cfe0d5; }
  .metric-card.accent .value{ color:#fff; }
  .metric-card.success-card{ background:var(--success-tint); border-color:var(--success); }
  .metric-card .label{ font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-2); margin-bottom:6px; }
  .metric-card .value{ font-family:var(--font-num); font-size:22px; font-weight:700; }

  .chart-wrap{ margin-bottom:20px; }
  .chart-wrap svg text{ font-family:var(--font-body); fill:var(--ink); }
  .chart-wrap svg text.amount{ font-family:var(--font-num); font-weight:700; fill:var(--forest-dark); }

  footer.note{ text-align:center; font-size:12px; color:var(--text-muted); margin-top:30px; }

  @media(max-width:640px){
    header.masthead .row{ flex-wrap:wrap; }
    header.masthead .meta{ width:100%; text-align:left; }
    .toolbar{ flex-direction:column; align-items:stretch; }
  }
</style>
</head>
<body>
<div class="wrap">

<script>
const NOTES = [500,200,100,50,20,10,5];
const COINS = [2,1,0.5,0.2,0.1,0.05,0.02,0.01];
const ALL = [...NOTES, ...COINS];
const START = {500:0,200:0,100:0,50:0,20:5,10:5,5:10,2:25,1:25,0.5:0,0.2:40,0.1:40,0.05:0,0.02:0,0.01:0};
const START_KLEIN = {500:0,200:0,100:0,50:0,20:0,10:0,5:2,2:10,1:20,0.5:0,0.2:0,0.1:0,0.05:0,0.02:0,0.01:0};
const ROLLE = {2:25, 1:25, 0.5:40, 0.2:40, 0.1:40, 0.05:50, 0.02:50, 0.01:50};
const STORAGE_KEY = 'kirmes-kassenabrechnung-verna';
const SUPABASE_URL = 'https://xifkpyaoqqghkgbgtcxd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_CEi2WjMywf7EonMniWysJg_q-LeW-TA';
const SB_HEADERS = { 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY, 'Content-Type':'application/json' };
const TOLERANZ = 2;
let kirmesName = '';

function fmt(v){
  return new Intl.NumberFormat('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}).format(v) + ' \u20ac';
}
function denomLabel(d){
  if(d>=5) return fmt(d) + ' Schein';
  const rolle = ROLLE[d];
  return rolle ? `${fmt(d)} <span class="rolle-hint">(Rolle: ${rolle} Stk.)</span>` : fmt(d);
}
function key(d){ return String(d).replace('.','_'); }
function jetzt(){ return new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}); }

function newBonkasse(mitgliederTag){
  return { name:'Bonkasse', type:'bon', anfang:{...START}, ende:{}, bewegungen:[], bonsNormal:0, bonsMitglied:0, mitgliederTag:mitgliederTag, useTablet:true, bonModus:'tablet', tabletUmsatz:0, verkaufsLog:[], verantwortlicher:'', endeZeitstempel:null, versiegeltZeitstempel:null };
}
function newEintritt(name, preis){
  return { name, type:'eintritt', anfang:{...START}, ende:{}, bewegungen:[], preis, anzEintritt:0, anzBand:0, verantwortlicher:'', endeZeitstempel:null, versiegeltZeitstempel:null };
}
function newSpende(name){
  return { name, type:'spende', ende:{}, verantwortlicher:'', endeZeitstempel:null, versiegeltZeitstempel:null };
}
function newGetraenke(name){
  return { name, type:'getraenke', anfang:{...START_KLEIN}, ende:{}, bewegungen:[], anzGetraenke:0, verantwortlicher:'', endeZeitstempel:null, versiegeltZeitstempel:null };
}
function frischeTage(){
  return {
    'Donnerstag': [ newGetraenke('Antrinken') ],
    'Freitag': [ newBonkasse(true), newEintritt('Eintritt 1 (20-22:30)', 10), newEintritt('Eintritt 2 (22:30-00:30)', 10) ],
    'Samstag': [ newBonkasse(false), newEintritt('Eintritt 1 (20-22:30)', 8), newEintritt('Eintritt 2 (22:30-00:30)', 8), newSpende('Ständchen Gruppe 1'), newSpende('Ständchen Gruppe 2') ],
    'Sonntag': [ newBonkasse(false), newSpende('Kuchenspenden') ],
    'Montag':  [ newBonkasse(false), newEintritt('Eintritt 1 (20-22:30)', 5), newEintritt('Eintritt 2 (22:30-00:30)', 5) ]
  };
}

let tage = frischeTage();
const tagNamen = Object.keys(tage);
let activeTag = tagNamen[0];
let activeKasse = 0;
let saveTimer = null;
let pendingSave = false;

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && parsed.tage){
        tage = parsed.tage;
        kirmesName = parsed.kirmesName || '';
      } else if(parsed && typeof parsed === 'object'){
        tage = parsed;
      }
      reconcileTage();
      setStatus('Zwischenstand geladen');
      return;
    }
  }catch(e){}
  setStatus('Neue Abrechnung');
}
function reconcileTage(){
  if(!tage || typeof tage !== 'object'){ tage = frischeTage(); return; }
  const frisch = frischeTage();
  tagNamen.forEach(t=>{
    if(!Array.isArray(tage[t])) tage[t] = frisch[t];
    tage[t].forEach(k=>{
      if(k.type==='bon'){
        if(!k.bonModus) k.bonModus = k.useTablet===false ? 'manuell' : 'tablet';
        if(!Array.isArray(k.verkaufsLog)) k.verkaufsLog = [];
      }
    });
  });
}
function scheduleSave(){
  setStatus('Wird gespeichert …');
  pendingSave = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 300);
  scheduleKabSync();
}
function kategorieVonKasse(k){
  if(k.type==='eintritt') return 'Eintrittsgelder';
  if(k.type==='bon' || k.type==='getraenke') return 'Bon-/Getränkeverkauf';
  if(k.type==='spende') return 'Spenden';
  return 'Sonstige Einnahmen';
}
function berechneTagKategorien(tag){
  const kassen = tage[tag] || [];
  const kategorien = {};
  kassen.forEach(k=>{
    const kat = kategorieVonKasse(k);
    kategorien[kat] = (kategorien[kat]||0) + istUmsatz(k);
  });
  return kategorien;
}
let kabSyncTimer = null;
function scheduleKabSync(){
  clearTimeout(kabSyncTimer);
  kabSyncTimer = setTimeout(()=> syncKabErgebnis(activeTag), 800);
}
async function syncKabErgebnis(tag){
  try{
    const kategorien = berechneTagKategorien(tag);
    const gesamt = Object.values(kategorien).reduce((s,v)=>s+v,0);
    await fetch(`${SUPABASE_URL}/rest/v1/kassenabrechnung_ergebnis`, {
      method:'POST',
      headers: Object.assign({}, SB_HEADERS, {'Prefer':'return=minimal,resolution=merge-duplicates'}),
      body: JSON.stringify({ id: tag, data: { kirmesName, kategorien, gesamt, aktualisiert: jetzt() } })
    });
  }catch(e){ /* offline - kein Problem, wird beim naechsten Speichern erneut versucht */ }
}
function flushSave(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({kirmesName, tage}));
    setStatus('Gespeichert · ' + jetzt() + ' Uhr');
    pendingSave = false;
  }catch(e){
    setStatus('Speichern fehlgeschlagen');
  }
}
window.addEventListener('beforeunload', ()=>{ if(pendingSave) flushSave(); });
window.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden' && pendingSave) flushSave(); });
function onKirmesName(val){
  kirmesName = val;
  scheduleSave();
}
function setStatus(text){
  const el = document.getElementById('save-status');
  if(el) el.textContent = text;
}

function askConfirm(message, onYes){
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(27,42,34,0.45);display:flex;align-items:center;justify-content:center;z-index:10001;';
  overlay.innerHTML = `
    <div style="background:var(--paper-2);border-radius:10px;max-width:420px;width:90%;padding:22px 24px;box-shadow:0 10px 30px rgba(0,0,0,0.3);">
      <div style="font-size:14.5px;color:var(--ink);margin-bottom:18px;line-height:1.5;">${message}</div>
      <div style="display:flex;justify-content:flex-end;gap:8px;">
        <button id="confirm-cancel">Abbrechen</button>
        <button id="confirm-ok" class="primary">Ja, fortfahren</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#confirm-cancel').onclick = ()=> overlay.remove();
  overlay.querySelector('#confirm-ok').onclick = ()=>{ overlay.remove(); onYes(); };
}
function resetAll(){
  askConfirm('Neue Kirmes starten? Alle aktuellen Werte werden gelöscht. Preise und Kassenstruktur bleiben erhalten.', ()=>{
    tage = frischeTage();
    kirmesName = '';
    const nameInput = document.getElementById('kirmes-name');
    if(nameInput) nameInput.value = '';
    activeTag = tagNamen[0];
    activeKasse = 0;
    renderAll();
    scheduleSave();
    setStatus('Zurückgesetzt');
  });
}

function exportFile(){
  const blob = new Blob([JSON.stringify({kirmesName, tage}, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const datum = new Date().toISOString().slice(0,10);
  const slug = (kirmesName||'kassenabrechnung').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  a.href = url;
  a.download = `kirmes-${slug || 'kassenabrechnung'}-${datum}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  setStatus('Als Datei gespeichert');
}
function importFile(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(parsed && parsed.tage){
        tage = parsed.tage;
        kirmesName = parsed.kirmesName || '';
      } else {
        tage = parsed;
      }
      const nameInput = document.getElementById('kirmes-name');
      if(nameInput) nameInput.value = kirmesName;
      activeTag = tagNamen.includes(activeTag) ? activeTag : tagNamen[0];
      activeKasse = 0;
      renderAll();
      scheduleSave();
      setStatus('Datei geladen');
    }catch(err){
      setStatus('Datei ungültig');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

function sumDenoms(obj){ return obj ? ALL.reduce((s,d)=> s + (obj[d]||0)*d, 0) : 0; }
function nettoBewegung(list){
  if(!list) return 0;
  return list.reduce((s,n)=> s + (n.typ==='entnahme' ? -Math.abs(n.betrag||0) : Math.abs(n.betrag||0)), 0);
}
function istUmsatz(k){
  if(k.type==='spende') return sumDenoms(k.ende);
  return sumDenoms(k.ende) - sumDenoms(k.anfang) - nettoBewegung(k.bewegungen);
}
function sollManuellBon(k){ return (k.bonsNormal||0)*1.8 + (k.bonsMitglied||0)*(k.mitgliederTag?1.0:1.8); }
function sollUmsatz(k){
  if(k.type==='bon') return k.bonModus==='tablet' ? (k.tabletUmsatz||0) : sollManuellBon(k);
  if(k.type==='eintritt') return (k.anzEintritt||0)*(k.preis||0) + (k.anzBand||0)*18;
  if(k.type==='getraenke') return (k.anzGetraenke||0)*1;
  return istUmsatz(k);
}
function bonsAnzahlGeschaetzt(k){
  if(k.type!=='bon') return 0;
  if(k.bonModus==='tablet') return Math.round((k.tabletUmsatz||0)/1.8);
  return (k.bonsNormal||0) + (k.bonsMitglied||0);
}
function endeErfasst(k){ return sumDenoms(k.ende) > 0; }
function currentKasse(){ return (tage[activeTag]||[])[activeKasse]; }
function tagesUmsatz(t){ return (tage[t]||[]).reduce((s,k)=> s + istUmsatz(k), 0); }

function renderAll(){
  renderTagTabs();
  renderKassenTabs();
  renderPanel();
}

function renderTagTabs(){
  const el = document.getElementById('tag-tabs');
  el.innerHTML = '';
  tagNamen.forEach(t=>{
    const btn = document.createElement('button');
    btn.textContent = t;
    if(t===activeTag) btn.classList.add('active');
    btn.onclick = ()=>{ activeTag=t; activeKasse=0; renderAll(); };
    el.appendChild(btn);
  });
}

function renderKassenTabs(){
  const el = document.getElementById('kassen-tabs');
  el.innerHTML = '';
  (tage[activeTag]||[]).forEach((k,i)=>{
    const warn = !endeErfasst(k);
    const btn = document.createElement('button');
    btn.innerHTML = k.name + (warn ? '<span class="dot-warn"></span>' : '');
    if(i===activeKasse) btn.classList.add('active');
    btn.onclick = ()=>{ activeKasse=i; renderKassenTabs(); renderPanel(); };
    el.appendChild(btn);
  });
}

function denomTable(phase){
  const k = currentKasse();
  let rows = '';
  [...NOTES, ...COINS].forEach(d=>{
    const val = (k[phase]||{})[d] || 0;
    rows += `<tr>
      <td class="label-cell">${denomLabel(d)}</td>
      <td><input type="number" min="0" step="1" value="${val||''}" placeholder="0" data-phase="${phase}" data-d="${d}" oninput="onCount(this)"/></td>
      <td class="num" id="val-${phase}-${key(d)}">${fmt(val*d)}</td>
    </tr>`;
  });
  return `<table class="ledger">
    <tr><th>Stückelung</th><th>Anzahl</th><th class="num">Wert</th></tr>
    ${rows}
    <tr class="sum-row"><td class="label-cell">Summe</td><td></td><td class="num" id="total-${phase}">${fmt(sumDenoms(k[phase]))}</td></tr>
  </table>`;
}

function bewegungenList(){
  const k = currentKasse();
  let rows = (k.bewegungen||[]).map((n,i)=>`
    <div class="bewegung-row">
      <select data-idx="${i}" onchange="onBewegungTyp(this)">
        <option value="einlage" ${n.typ!=='entnahme'?'selected':''}>Einlage</option>
        <option value="entnahme" ${n.typ==='entnahme'?'selected':''}>Entnahme</option>
      </select>
      <input type="number" min="0" step="0.01" value="${n.betrag||''}" placeholder="Betrag" data-idx="${i}" oninput="onBewegungBetrag(this)"/>
      <input type="text" value="${n.notiz||''}" placeholder="Notiz (z. B. Bandbezahlung, 20:30 Uhr)" data-idx="${i}" oninput="onBewegungNotiz(this)"/>
      <button class="small" onclick="removeBewegung(${i})">Entfernen</button>
    </div>`).join('');
  return `<div>${rows}</div>
    <button class="small" onclick="addBewegung()" style="margin-top:2px;">+ Bewegung hinzufügen</button>
    <div style="margin-top:10px;font-size:13.5px;">Netto Bargeldbewegungen: <strong style="font-family:var(--font-num);" id="beweg-total">${fmt(nettoBewegung(k.bewegungen))}</strong></div>`;
}

function verkaufSection(){
  const k = currentKasse();
  if(k.type==='bon'){
    const modus = k.bonModus || 'tablet';
    let html = `<div class="modus-row" style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;">
      <label style="display:flex;align-items:center;gap:6px;font-size:13.5px;">
        <input type="radio" name="bon-modus" value="tablet" ${modus==='tablet'?'checked':''} onchange="onBonModus('tablet')"/> Kassensystem (Tablet-App)
      </label>
      <label style="display:flex;align-items:center;gap:6px;font-size:13.5px;">
        <input type="radio" name="bon-modus" value="manuell" ${modus==='manuell'?'checked':''} onchange="onBonModus('manuell')"/> Endsumme manuell eintragen
      </label>
    </div>`;

    if(modus==='tablet'){
      html += `<div class="verkauf-fields" style="align-items:flex-end;gap:14px;">
        <div class="field">
          <label class="field-label">Umsatz laut Kassen-App</label>
          <input type="number" min="0" step="0.01" value="${k.tabletUmsatz||''}" placeholder="0,00" oninput="onVerkauf('tabletUmsatz',this.value)" style="width:140px;"/>
        </div>
        <button class="small" onclick="holeKassenAppUmsatz()">\u21bb Von Kassen-App abrufen</button>
        <span style="font-size:12px;color:var(--text-muted);" id="kassenapp-sync-status">${k.tabletUmsatzZeit ? 'zuletzt abgerufen um '+k.tabletUmsatzZeit+' Uhr' : 'noch nicht abgerufen'}</span>
      </div>`;
    } else {
      html += `<div class="verkauf-fields">
        <div class="field">
          <label class="field-label">Bons normal (1,80 \u20ac)</label>
          <input type="number" min="0" step="1" value="${k.bonsNormal||''}" placeholder="0" oninput="onVerkauf('bonsNormal',this.value)" style="width:110px;"/>
        </div>
        ${k.mitgliederTag ? `<div class="field">
          <label class="field-label">Mitglieder-Bons (1,00 \u20ac)</label>
          <input type="number" min="0" step="1" value="${k.bonsMitglied||''}" placeholder="0" oninput="onVerkauf('bonsMitglied',this.value)" style="width:110px;"/>
        </div>` : ''}
      </div>`;
    }
    return html;
  }
  if(k.type==='getraenke'){
    return `<div class="verkauf-fields">
      <div class="field">
        <label class="field-label">Preis pro Getränk</label>
        <div class="static-value">${fmt(1)}</div>
      </div>
      <div class="field">
        <label class="field-label">Anzahl Getränke verkauft</label>
        <input type="number" min="0" step="1" value="${k.anzGetraenke||''}" placeholder="0" oninput="onVerkauf('anzGetraenke',this.value)" style="width:110px;"/>
      </div>
    </div>`;
  }
  return `<div class="verkauf-fields">
    <div class="field">
      <label class="field-label">Eintrittspreis</label>
      <div class="static-value">${fmt(k.preis)}</div>
    </div>
    <div class="field">
      <label class="field-label">Anzahl Eintritte</label>
      <input type="number" min="0" step="1" value="${k.anzEintritt||''}" placeholder="0" oninput="onVerkauf('anzEintritt',this.value)" style="width:100px;"/>
    </div>
    <div class="field">
      <label class="field-label">Anzahl Dauerbänder (18 \u20ac)</label>
      <input type="number" min="0" step="1" value="${k.anzBand||''}" placeholder="0" oninput="onVerkauf('anzBand',this.value)" style="width:100px;"/>
    </div>
  </div>`;
}

function versiegelBlock(k){
  return `<div class="versiegel-row">
    <button class="small" onclick="onVersiegeln()">Kasse versiegeln (jetzt)</button>
    <span class="status-text">${k.versiegeltZeitstempel ? 'Versiegelt um '+k.versiegeltZeitstempel+' Uhr' : 'Noch nicht versiegelt'}</span>
  </div>`;
}

function renderPanel(){
  let k = currentKasse();
  if(!k){
    activeKasse = 0;
    k = currentKasse();
  }
  if(!k){
    document.getElementById('kasse-panel').innerHTML = '<div class="card">Keine Kasse für diesen Tag hinterlegt.</div>';
    renderGesamt();
    renderChart();
    return;
  }
  const panel = document.getElementById('kasse-panel');

  if(k.type==='spende'){
    panel.innerHTML = `
      <div class="card">
        <div class="verantwortlich-row">
          <label class="field-label">Verantwortlicher für diese Kasse</label>
          <input type="text" value="${k.verantwortlicher||''}" placeholder="Name eintragen" oninput="onVerantwortlich(this.value)" style="width:240px;"/>
        </div>
        ${versiegelBlock(k)}
        <div id="warnbanner-slot">${!endeErfasst(k) ? `<div class="warnbanner">Diese Spendenkasse wurde noch nicht gezählt.</div>` : ''}</div>
        <div class="section-label">Gezählter Betrag <span id="ende-hint">${k.endeZeitstempel ? `<span class="hint">gezählt um ${k.endeZeitstempel} Uhr</span>` : ''}</span></div>
        <div id="tbl-ende">${denomTable('ende')}</div>
      </div>
      <div class="card" style="background:var(--success-tint);border-color:var(--success);">
        <div class="section-label" style="color:var(--success);border-color:transparent;">Gesammelte Spenden</div>
        <div style="font-family:var(--font-num);font-size:26px;font-weight:700;color:var(--success);" id="ist-result">${fmt(istUmsatz(k))}</div>
      </div>
    `;
    renderGesamt();
    renderChart();
    return;
  }

  const diff = istUmsatz(k) - sollUmsatz(k);
  const diffOk = Math.abs(diff) <= TOLERANZ;
  panel.innerHTML = `
    <div class="card">
      <div class="verantwortlich-row">
        <label class="field-label">Verantwortlicher für diese Kasse</label>
        <input type="text" value="${k.verantwortlicher||''}" placeholder="Name eintragen" oninput="onVerantwortlich(this.value)" style="width:240px;"/>
      </div>
      ${versiegelBlock(k)}
      <div id="warnbanner-slot">${!endeErfasst(k) ? `<div class="warnbanner">Endbestand für diese Kasse wurde noch nicht erfasst.</div>` : ''}</div>

      <div class="section-label">Anfangsbestand</div>
      <div id="tbl-anfang" style="margin-bottom:22px;">${denomTable('anfang')}</div>

      <div class="section-label">Bargeldbewegungen</div>
      <div id="beweg-wrap" style="margin-bottom:22px;">${bewegungenList()}</div>

      <div class="section-label">Endbestand <span id="ende-hint">${k.endeZeitstempel ? `<span class="hint">gezählt um ${k.endeZeitstempel} Uhr</span>` : ''}</span></div>
      <div id="tbl-ende" style="margin-bottom:22px;">${denomTable('ende')}</div>

      <div class="section-label">${k.type==='bon' ? 'Soll-Umsatz Quelle' : 'Verkaufszahlen'}</div>
      <div id="verkauf-wrap">${verkaufSection()}</div>

      <div class="result-grid">
        <div class="item">
          <div class="label">Ist-Umsatz</div>
          <div class="value" id="ist-result">${fmt(istUmsatz(k))}</div>
        </div>
        <div class="item">
          <div class="label" id="soll-label">Soll-Umsatz${k.type==='bon' && k.bonModus==='tablet' ? ' (Tablet)' : ''}</div>
          <div class="value" id="soll-result">${fmt(sollUmsatz(k))}</div>
        </div>
        <div class="item">
          <div class="label">Differenz</div>
          <div class="value ${diffOk?'ok':'warn'}" id="diff-result">${fmt(diff)}</div>
        </div>
      </div>
    </div>
  `;
  renderGesamt();
  renderChart();
}

function onVersiegeln(){
  currentKasse().versiegeltZeitstempel = jetzt();
  renderPanel();
  scheduleSave();
}
function onVerantwortlich(val){
  currentKasse().verantwortlicher = val;
  scheduleSave();
}
function onCount(input){
  const phase = input.dataset.phase, d = parseFloat(input.dataset.d);
  const k = currentKasse();
  if(!k[phase]) k[phase] = {};
  k[phase][d] = parseInt(input.value) || 0;
  document.getElementById(`val-${phase}-${key(d)}`).textContent = fmt(k[phase][d]*d);
  document.getElementById(`total-${phase}`).textContent = fmt(sumDenoms(k[phase]));
  if(phase==='ende'){
    k.endeZeitstempel = jetzt();
    const hintEl = document.getElementById('ende-hint');
    if(hintEl) hintEl.innerHTML = `<span class="hint">gezählt um ${k.endeZeitstempel} Uhr</span>`;
  }
  refreshResults();
  scheduleSave();
}
function onBewegungBetrag(input){
  const i = parseInt(input.dataset.idx);
  currentKasse().bewegungen[i].betrag = parseFloat(input.value) || 0;
  document.getElementById('beweg-total').textContent = fmt(nettoBewegung(currentKasse().bewegungen));
  refreshResults();
  scheduleSave();
}
function onBewegungTyp(select){
  const i = parseInt(select.dataset.idx);
  currentKasse().bewegungen[i].typ = select.value;
  document.getElementById('beweg-total').textContent = fmt(nettoBewegung(currentKasse().bewegungen));
  refreshResults();
  scheduleSave();
}
function onBewegungNotiz(input){
  const i = parseInt(input.dataset.idx);
  currentKasse().bewegungen[i].notiz = input.value;
  scheduleSave();
}
function addBewegung(){
  currentKasse().bewegungen.push({betrag:0, notiz:'', typ:'einlage'});
  document.getElementById('beweg-wrap').innerHTML = bewegungenList();
  scheduleSave();
}
function removeBewegung(i){
  currentKasse().bewegungen.splice(i,1);
  document.getElementById('beweg-wrap').innerHTML = bewegungenList();
  refreshResults();
  scheduleSave();
}
function onVerkauf(field, val){
  const k = currentKasse();
  k[field] = (field==='tabletUmsatz') ? parseFloat(val)||0 : (parseInt(val)||0);
  refreshResults();
  scheduleSave();
}
async function holeKassenAppUmsatz(){
  const k = currentKasse();
  if(!k || k.type!=='bon') return;
  const statusEl = document.getElementById('kassenapp-sync-status');
  if(statusEl) statusEl.textContent = 'lädt …';
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/verkaufe?tag=eq.${encodeURIComponent(activeTag)}&select=summe`, { headers: SB_HEADERS });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const rows = await res.json();
    const summe = rows.reduce((s,r)=> s + (parseFloat(r.summe)||0), 0);
    k.tabletUmsatz = summe;
    k.tabletUmsatzZeit = jetzt();
    const input = document.querySelector('.verkauf-fields input[type=number]');
    if(input) input.value = summe || '';
    if(statusEl) statusEl.textContent = 'zuletzt abgerufen um ' + k.tabletUmsatzZeit + ' Uhr';
    refreshResults();
    scheduleSave();
  }catch(e){
    if(statusEl) statusEl.textContent = 'keine Verbindung zur Kassen-App';
  }
}
setInterval(()=>{
  const k = currentKasse();
  if(k && k.type==='bon' && k.bonModus==='tablet') holeKassenAppUmsatz();
}, 20000);
function onBonModus(modus){
  currentKasse().bonModus = modus;
  renderPanel();
  scheduleSave();
}
function updateResults(){
  renderPanel();
  scheduleSave();
}
function refreshResults(){
  const k = currentKasse();
  if(!k) return;
  updateWarnSlot(k);
  if(k.type==='spende'){
    const istEl = document.getElementById('ist-result');
    if(istEl) istEl.textContent = fmt(istUmsatz(k));
    renderGesamt();
    renderChart();
    return;
  }
  const diff = istUmsatz(k) - sollUmsatz(k);
  const diffOk = Math.abs(diff) <= TOLERANZ;
  const istEl = document.getElementById('ist-result');
  const sollEl = document.getElementById('soll-result');
  const diffEl = document.getElementById('diff-result');
  if(istEl) istEl.textContent = fmt(istUmsatz(k));
  if(sollEl) sollEl.textContent = fmt(sollUmsatz(k));
  if(diffEl){ diffEl.textContent = fmt(diff); diffEl.className = 'value ' + (diffOk ? 'ok' : 'warn'); }
  renderGesamt();
  renderChart();
}
function updateWarnSlot(k){
  const slot = document.getElementById('warnbanner-slot');
  if(!slot) return;
  const msg = k.type==='spende' ? 'Diese Spendenkasse wurde noch nicht gezählt.' : 'Endbestand für diese Kasse wurde noch nicht erfasst.';
  slot.innerHTML = !endeErfasst(k) ? `<div class="warnbanner">${msg}</div>` : '';
}

function renderGesamt(){
  const el = document.getElementById('gesamt-summary');
  let totalAnfang=0, totalBeweg=0, totalIst=0, totalSoll=0, totalBons=0, totalEnde=0, totalSpenden=0;
  tagNamen.forEach(t=>{
    tage[t].forEach(k=>{
      totalEnde += sumDenoms(k.ende);
      if(k.type==='spende'){ totalSpenden += sumDenoms(k.ende); return; }
      totalAnfang += sumDenoms(k.anfang);
      totalBeweg += nettoBewegung(k.bewegungen);
      totalIst += istUmsatz(k);
      totalSoll += sollUmsatz(k);
      totalBons += bonsAnzahlGeschaetzt(k);
    });
  });
  const totalDiff = totalIst - totalSoll;
  const diffOk = Math.abs(totalDiff) <= TOLERANZ;
  el.innerHTML = `
    <div class="metric-card"><div class="label">Anfangsgeld gesamt</div><div class="value">${fmt(totalAnfang)}</div></div>
    <div class="metric-card"><div class="label">Netto Bewegungen</div><div class="value">${fmt(totalBeweg)}</div></div>
    <div class="metric-card accent"><div class="label">Ist-Umsatz gesamt</div><div class="value">${fmt(totalIst)}</div></div>
    <div class="metric-card"><div class="label">Soll-Umsatz gesamt</div><div class="value">${fmt(totalSoll)}</div></div>
    <div class="metric-card"><div class="label">Differenz gesamt</div><div class="value ${diffOk?'ok':'warn'}">${fmt(totalDiff)}</div></div>
    <div class="metric-card"><div class="label">Bons gesamt (geschätzt)</div><div class="value">${totalBons} Stk.</div></div>
    <div class="metric-card"><div class="label">Spenden gesamt</div><div class="value">${fmt(totalSpenden)}</div></div>
    <div class="metric-card success-card"><div class="label">Bargeld am Ende gesamt</div><div class="value">${fmt(totalEnde)}</div></div>
  `;
}

function renderChart(){
  const el = document.getElementById('tages-chart');
  const werte = tagNamen.map(t=>({tag:t, wert:tagesUmsatz(t)}));
  const max = Math.max(1, ...werte.map(w=>Math.max(w.wert,0)));
  const barW = 110, gap = 36, chartH = 150, leftPad = 10, topPad = 26;
  const width = werte.length * (barW+gap) - gap + leftPad*2;
  let bars = '';
  werte.forEach((w,i)=>{
    const h = Math.max(2, (Math.max(w.wert,0)/max) * chartH);
    const x = leftPad + i*(barW+gap);
    const y = chartH - h + topPad;
    bars += `<rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="3" fill="#2f4a3c"/>
      <text x="${x+barW/2}" y="${y-8}" text-anchor="middle" class="amount" font-size="13">${fmt(w.wert)}</text>
      <text x="${x+barW/2}" y="${chartH+topPad+24}" text-anchor="middle" font-size="13">${w.tag}</text>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${width} ${chartH+topPad+34}" style="width:100%;max-width:600px;">${bars}</svg>`;
}

function kassenTypLabel(k){
  if(k.type==='bon') return 'Bonverkauf';
  if(k.type==='eintritt') return 'Eintrittskasse';
  if(k.type==='getraenke') return 'Getränkeverkauf';
  return 'Spendensammlung';
}

function printSummary(){
  const heute = new Date().toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
  let tagSections = '';
  let gAnfang=0, gBeweg=0, gEnde=0, gIst=0, gSoll=0;

  tagNamen.forEach(t=>{
    const kassenDesTags = tage[t];
    if(kassenDesTags.length===0) return;
    let rows = '';
    let tAnfang=0, tBeweg=0, tEnde=0, tIst=0, tSoll=0;
    kassenDesTags.forEach(k=>{
      const anfang = k.type==='spende' ? null : sumDenoms(k.anfang);
      const beweg = k.type==='spende' ? null : nettoBewegung(k.bewegungen);
      const ende = sumDenoms(k.ende);
      const ist = istUmsatz(k);
      const soll = k.type==='spende' ? null : sollUmsatz(k);
      const diff = soll===null ? null : (ist - soll);
      if(anfang!==null) tAnfang += anfang;
      if(beweg!==null) tBeweg += beweg;
      tEnde += ende;
      tIst += ist;
      if(soll!==null) tSoll += soll;
      rows += `<tr>
        <td>${k.name}</td>
        <td>${k.verantwortlicher||'\u2013'}</td>
        <td class="mono">${k.versiegeltZeitstempel||'\u2013'}</td>
        <td class="mono">${k.endeZeitstempel||'\u2013'}</td>
        <td class="num">${anfang===null?'\u2013':fmt(anfang)}</td>
        <td class="num">${beweg===null?'\u2013':fmt(beweg)}</td>
        <td class="num">${endeErfasst(k)?fmt(ende):'<span class="nichterfasst">nicht erfasst</span>'}</td>
        <td class="num strong">${fmt(ist)}</td>
        <td class="num">${soll===null?'\u2013':fmt(soll)}</td>
        <td class="num ${diff===null?'':(Math.abs(diff)<=TOLERANZ?'ok':'warn')}">${diff===null?'\u2013':fmt(diff)}</td>
      </tr>`;
    });
    gAnfang+=tAnfang; gBeweg+=tBeweg; gEnde+=tEnde; gIst+=tIst; gSoll+=tSoll;
    tagSections += `
      <div class="tag-block">
        <div class="tag-title">${t}</div>
        <table>
          <colgroup>
            <col class="c-kasse"><col class="c-verantw"><col class="c-versiegelt"><col class="c-gezaehlt">
            <col class="c-num"><col class="c-num"><col class="c-num"><col class="c-num"><col class="c-num"><col class="c-diff">
          </colgroup>
          <thead><tr>
            <th>Kasse</th><th>Verantwortlicher</th><th>Versiegelt</th><th>Gezählt</th>

  });

  const logoSrc = document.getElementById('logo-img').src;

      .header .meta{ text-align:right; font-size:8.5px; color:#555; white-space:nowrap; }

      colgroup col.c-gezaehlt{ width:7.5%; }
      colgroup col.c-num{ width:9%; }
      colgroup col.c-diff{ width:10.5%; }
      thead th{ background:#eeeeee; border-bottom:1px solid #999; padding:3px 5px; text-align:left; font-weight:600; }
      tbody td{ border-bottom:0.5px solid #ddd; padding:3px 5px; vertical-align:middle; overflow-wrap:break-word; }

      .num{ text-align:right; font-variant-numeric:tabular-nums; }
      .mono{ font-variant-numeric:tabular-nums; color:#555; }
      .strong{ font-weight:600; }

      .warn{ color:#b32424; font-weight:600; }
      .nichterfasst{ color:#b32424; font-style:italic; }
      .gesamt-box{ margin-top:12px; padding:8px 12px; background:#f7f7f7; border:1px solid #999; }

    </style></head><body><div class="page">

}

document.getElementById('header-date').textContent = 'Stand: ' + new Date().toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}) + ', ' + jetzt() + ' Uhr';
function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(()=>{});
  } else {
    document.exitFullscreen().catch(()=>{});
  }
}
document.addEventListener('fullscreenchange', ()=>{
  const btn = document.getElementById('fullscreen-btn');
  if(btn) btn.textContent = document.fullscreenElement ? '\u26f6 Vollbild verlassen' : '\u26f6 Vollbild';
});
loadState();
document.getElementById('kirmes-name').value = kirmesName;
renderAll();
